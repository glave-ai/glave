[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/glave-ai/glave"
homepage = "https://github.com/glave-ai/glave"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unreachable_pub = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"

# Safety lints are "forbid": no attribute anywhere in the code can switch them off.
# Tests get their exemptions only through clippy.toml, never through attributes.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"   # #[must_use] ceremony, not safety
missing_errors_doc = "allow"   # `# Errors` doc sections, not safety
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unwrap_in_result = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
exit = "forbid"                # return an ExitCode from main instead
mod_module_files = "forbid"    # `foo.rs` + `foo/`, never `mod.rs`
allow_attributes = "forbid"    # no #[allow] at all; see AGENTS.md for #[expect]
allow_attributes_without_reason = "deny"
mem_forget = "forbid"
# Restriction lints that catch what review would otherwise have to (AGENTS.md, "Rust").
unused_result_ok = "deny"
clone_on_ref_ptr = "deny"
infinite_loop = "deny"
iter_over_hash_type = "deny"
print_stdout = "deny"           # libraries never print; binaries say so once, at their root
print_stderr = "deny"

[workspace.dependencies]
anyhow = "1"
# The keys aws-sigv4 signs with: its own type for them, no SDK.
aws-credential-types = { version = "1.3", default-features = false }
# AWS Signature Version 4 for Bedrock without the SDK: AWS's own signer, tested against
# AWS's published suite; only HTTP request signing (it needs `http1` to build).
aws-sigv4 = { version = "1.6", default-features = false, features = ["sign-http", "http1"] }
# The crypto rustls already builds: signing Google service account assertions (RS256), and,
# in tests, tokens as a fake identity provider.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "ring-io"] }
# PEM keys and JWT segments for Google service accounts (already in the tree, under
# jsonwebtoken and kube).
base64 = "0.23"
bytes = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
# The session API's own sentences in the caller's language: Mozilla's Fluent, the message format
# made for translators (plurals, genders, a language's own grammar), with no build step.
fluent-bundle = "0.16"
# The `Stream` trait, to read the streams object_store answers (already in the tree, under it,
# hyper and reqwest).
futures-core = { version = "0.3", default-features = false }
glave-acme = { path = "crates/acme" }
glave-aws = { path = "crates/aws" }
glave-azure = { path = "crates/azure" }
glave-bucket = { path = "crates/bucket" }
glave-computer = { path = "crates/computer" }
glave-config = { path = "crates/config" }
glave-event = { path = "crates/event" }
glave-gateway = { path = "crates/gateway" }
glave-gateway-service = { path = "crates/gateway-service" }
glave-google = { path = "crates/google" }
glave-harness = { path = "crates/harness" }
glave-identity = { path = "crates/identity" }
glave-keys = { path = "crates/keys" }
glave-mcp = { path = "crates/mcp" }
glave-memory = { path = "crates/memory" }
glave-ports = { path = "crates/ports" }
glave-process = { path = "crates/process" }
glave-provider-anthropic = { path = "crates/provider-anthropic" }
glave-provider-openai = { path = "crates/provider-openai" }
glave-session = { path = "crates/session" }
glave-shell = { path = "crates/shell" }
glave-store-postgres = { path = "crates/store-postgres" }
glave-store-sqlite = { path = "crates/store-sqlite" }
glave-web = { path = "crates/web" }
getrandom = "0.4"
globset = "0.4"
hmac = "0.13"
# HTML to Markdown for web_fetch: small, maintained, Turndown's design, on html5ever.
htmd = "0.5"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
ignore = "0.4"
# Images a person adds or the agent reads, made fit to send a model once: decoded (PNG, JPEG,
# GIF, WebP), turned upright, scaled down and encoded as a JPEG. Pure Rust, only the formats
# models read; zune-image, the other choice, was three times the size once it read WebP.
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# ACME (RFC 8555) for glave's own certificate (glave-acme): accounts, orders and challenges, on
# the hyper, rustls and aws-lc-rs glave already uses; its key and request made with rcgen.
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls", "rcgen"] }
# Snapshot tests for stable text formats (AGENTS.md). Dev only; no default features.
insta = { version = "1", default-features = false }
# Verifying OIDC tokens, on aws-lc-rs, the crypto rustls already uses.
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
# The Linux sandbox's Landlock fallback, where bubblewrap cannot start (Linux only).
landlock = "0.4.7"
# Syscall numbers and socket families for the Linux sandbox's seccomp filter (already in the
# tree through tokio, seccompiler and landlock).
libc = "0.2"
# Kubernetes types for the worker backend on Kubernetes: the API at its oldest supported version.
k8s-openapi = { version = "0.28", default-features = false, features = ["std", "earliest"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
# The Kubernetes client for the worker backend on Kubernetes: kubeconfig and in-cluster auth,
# rustls on aws-lc-rs as the rest of glave, and WebSockets for exec, attach and port-forward.
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "ws"] }
# The memory allocator of glave's static Linux builds (crates/cli/src/allocator.rs): musl's own
# is slow at the many small allocations glave makes. Microsoft's, MIT, one C file built with cc.
# `no_thp`: it asks for no transparent huge pages; zeroing one cost every start about half a
# millisecond and made nothing faster (#682). The system's own setting still applies.
mimalloc = { version = "0.1.52", features = ["no_thp"] }
# Blobs' bytes in a folder or a bucket (specs/storage.md, "Which stores"): Apache Arrow's one
# interface for a local folder and every object store, so one code path serves them all. `aws`
# is any S3-compatible bucket (S3, R2, GCS, Ceph, SeaweedFS), on the reqwest, rustls and
# aws-lc-rs glave already uses.
object_store = { version = "0.14", default-features = false, features = ["fs", "aws"] }
# OpenTelemetry, only behind the `otlp` features: spans and metrics to an OTLP collector.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
# OTLP over HTTP with protobuf, on the reqwest and rustls glave already uses (no gRPC stack).
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
proptest = "1"
# Self-signed certificates for workers, on aws-lc-rs, the crypto rustls already uses.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1"
rmcp = { version = "3.5.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-platform-verifier = "0.7"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
# Files opened one name at a time from a folder handle (openat), for confinement.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
# The Linux sandbox's seccomp filter, built and compiled to BPF in safe Rust (Firecracker's).
seccompiler = { version = "0.5", default-features = false }
# JSON Schema of the session API, derived beside serde (already in the tree, under rmcp).
schemars = { version = "1.2", default-features = false, features = ["derive", "std", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", default-features = false }
# Content-free spans and metrics events (already in the tree, under hyper and rmcp).
tracing = { version = "0.1", default-features = false, features = ["std"] }
# tracing's spans as OpenTelemetry spans, and its counter and histogram events as metrics.
tracing-opentelemetry = { version = "0.34", default-features = false, features = ["metrics"] }
# Local logs (`--log`): spans written to a file, filtered by GLAVE_LOG.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-jiff-0_2", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false }
toml = { version = "1", default-features = false, features = ["display", "parse", "serde", "std"] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
url = "2"
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
# Passkeys (WebAuthn) for the person's own server (glave-identity): kanidm's relying party, its
# 0.6 line on RustCrypto rather than OpenSSL (a pre-release, so pinned exactly).
webauthn-rs = { version = "=0.6.1-dev", default-features = false }
# When a certificate's life begins and ends (glave-acme), so it is renewed with a third left.
x509-parser = { version = "0.18", default-features = false }
zeroize = "1"

# Day-to-day builds: no debug info. A failing assert or a panic names its file and line without
# it, and builds and links are faster. Stepping through code takes the `debugging` profile below.
[profile.dev]
debug = false

# Decoding, scaling and encoding a photo unoptimized takes seconds; tests that fit one would.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

# Full debug info for stepping through code: `cargo build --profile debugging`.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# Releases (dist-workspace.toml): dist builds with a profile of its own name, the release one.
[profile.dist]
inherits = "release"
