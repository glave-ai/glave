<section class="card" data-testid="turn-changes" [attr.aria-labelledby]="headingId">
  <div class="head">
    <h2 class="heading" [id]="headingId">{{ copy.heading }}</h2>
    <span class="count" data-testid="turn-changes-count">{{ count() }}</span>
    <span class="counts" aria-hidden="true"
      ><span class="plus">{{ total().added }}</span
      ><span class="minus">{{ total().removed }}</span></span
    >
    <span class="glz-visually-hidden">{{ total().label }}</span>
  </div>
  <ul class="rows">
    @for (row of rows(); track row.path) {
      <li class="file">
        <button type="button" class="row" data-testid="turn-changes-file" (click)="show()">
          <span class="path">{{ row.path }}</span>
          <span class="counts" aria-hidden="true"
            ><span class="plus">{{ row.added }}</span
            ><span class="minus">{{ row.removed }}</span></span
          >
          <span class="glz-visually-hidden">{{ row.label }}</span>
        </button>
      </li>
    }
  </ul>
  @if (more(); as more) {
    <button type="button" class="more" data-testid="turn-changes-more" (click)="show()">
      {{ more }}
    </button>
  }
</section>
