<button glzNavItem data-testid="person" [glzPopoverTrigger]="mine">
  <span glzNavItemStart class="avatar" aria-hidden="true"><glz-avatar [name]="copy.you" /></span>
  {{ copy.you }}
</button>
<glz-popover #mine testId="person-menu">
  @if (several()) {
    <p class="heading" id="person-switch">{{ copy.switchTo }}</p>
    <div class="places" role="group" aria-labelledby="person-switch">
      @for (to of places(); track to.id) {
        <button
          glzNavItem
          data-testid="person-switch"
          [current]="to.current"
          (click)="switchTo(to)"
        >
          <span glzNavItemStart class="mark" aria-hidden="true">{{ to.letter }}</span>
          <span class="place">
            <span>{{ to.name }}</span
            >&ngsp;<span class="note">{{ to.note }}</span>
          </span>
          @if (to.current) {
            <glz-icon glzNavItemEnd [icon]="icons.current" [label]="copy.current" />
          }
        </button>
      }
    </div>
  }
  <a
    glzNavItem
    data-testid="nav-settings"
    [routerLink]="settingsLink"
    [icon]="icons.settings"
    (click)="followed()"
  >
    {{ copy.settings }}
  </a>
  @if (admin()) {
    <a
      glzNavItem
      data-testid="nav-admin"
      [routerLink]="adminLink"
      [icon]="icons.admin"
      (click)="followed()"
    >
      {{ copy.admin }}
    </a>
  }
  @if (invitesAlone()) {
    <button glzNavItem data-testid="nav-invite" [icon]="icons.invite" (click)="invite()">
      {{ copy.invite }}
    </button>
  }
  <button glzNavItem data-testid="person-sign-out" [icon]="icons.signOut" (click)="signOut()">
    {{ copy.signOut }}
  </button>
</glz-popover>
@defer (when inviting()) {
  <app-invite-dialog [(open)]="inviting" />
} @error {
  <app-unloaded class="error" />
}
