<ng-template #words>
  <span class="label" [attr.data-testid]="ids().label">{{ label() }}</span>
  @if (shown(); as headline) {
    <span
      class="headline"
      dir="auto"
      [class.fading]="fading()"
      [attr.data-testid]="ids().headline"
      >{{ headline }}</span
    >
  }
</ng-template>
@if (live()) {
  <p class="line live" [attr.data-testid]="ids().line">
    <ng-container [ngTemplateOutlet]="words" />
  </p>
} @else {
  <button
    type="button"
    class="line"
    [attr.aria-expanded]="open()"
    [attr.data-testid]="ids().line"
    (click)="toggle()"
  >
    <ng-container [ngTemplateOutlet]="words" />
    <glz-icon class="chevron glz-mirrored" [attr.data-testid]="ids().chevron" [icon]="chevron" />
  </button>
  @if (open()) {
    <div class="fold">
      <p class="text" dir="auto" [attr.data-testid]="ids().text">{{ text() }}</p>
    </div>
  }
}
