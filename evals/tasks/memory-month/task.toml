[task]
name = "glave/memory-month"
description = "A month of daily use in one store: preferences stated then changed, a quirk the agent finds, decisions and their reasons, more lasting facts than fit, tidy-up as the server runs it; then ten probes, each needing one earlier fact."

[agent]
# 39 threads and the tidy-ups between them.
timeout_sec = 2400

[glave]
tier = "hard"
memory = true
# As the server tidies: as each thread starts, each ledger it reads that is due (a week since
# the last run, or past 90% of the budget and an hour since).
tidy = "due"
# The month runs from 30 days ago to today, the probes all today. Threads work in three places:
# the first thread's project (atlas, whose files the workspace holds), beacon, and the person's
# Chats. Atlas gets more lasting facts than its ~1,000-token budget holds, and the person's own
# memory comes near it, so saves are refused and tidy-up compacts.
days_ago = 30
# A probe passes when its answer names the current fact and no replaced one; the attempt passes
# with 8 of the 10.
probe_share = 0.8

[[glave.threads]]
project = "chats"
days_ago = 30
messages = ["""A few things about me, for future chats:
- I use Helix as my editor.
- I write British English (colour, organise).
- Give me times on the 12-hour clock, with am and pm.
- Temperatures in Celsius, please.
- Keep answers short, without headings.
Please remember all of that."""]

[[glave.threads]]
days_ago = 29
messages = ["""A few atlas conventions I'd like you to remember:
- Who's on call is posted in the #ops-tern channel.
- Branches are named after the ticket, like ATL-123-short-title.
- We squash-merge, and the pull request title becomes the commit message.
- Every pull request needs an approval from someone outside the author's pod.
- Config lives in config/atlas.toml; nothing reads environment variables directly.
- Logs are JSON, one object per line."""]

[[glave.threads]]
project = "beacon"
days_ago = 28
messages = ["For beacon, we've settled on SQLite rather than Postgres, because each kiosk's data travels to head office on a USB stick every week. Please remember the decision and why."]

[[glave.threads]]
days_ago = 27
messages = ["For the record: we deploy atlas to Heroku, and merging to main ships it. Remember that."]

