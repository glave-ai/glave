<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>glave</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Installable as an app. The colours are Glaze's page surface (tokens.css), light and dark. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121314" />
  </head>
  <body>
    <!-- glave serve puts a fresh nonce here on every load, for the styles Angular adds (CSP). -->
    <app-root ngCspNonce="GLAVE_CSP_NONCE"></app-root>
  </body>
</html>
