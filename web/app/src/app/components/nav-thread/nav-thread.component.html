<a
  glzNavItem
  data-testid="nav-thread"
  [routerLink]="thread().link"
  [current]="thread().current"
  (click)="followed()"
>
  <span dir="auto" data-testid="nav-thread-title">{{ thread().title }}</span>
  @if (thread().running) {
    <glz-icon
      glzNavItemEnd
      class="status glz-spin"
      data-testid="nav-thread-running"
      [icon]="running.icon"
      [label]="running.label"
    />
  } @else if (thread().waiting) {
    <glz-icon
      glzNavItemEnd
      class="status"
      data-testid="nav-thread-waiting"
      [icon]="needsYou.icon"
      [label]="needsYou.label"
    />
  } @else {
    <time
      glzNavItemEnd
      class="since"
      data-testid="nav-thread-since"
      [attr.datetime]="thread().since.at"
    >
      <span aria-hidden="true">{{ thread().since.short }}</span>
      <span class="glz-visually-hidden">{{ thread().since.long }}</span>
    </time>
  }
</a>
@if (thread().hasChildren) {
  <div class="children" data-testid="nav-children">
    @for (child of thread().children; track child.id) {
      <app-nav-thread [thread]="child" (navigated)="followed()" />
    }
  </div>
}
