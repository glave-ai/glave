<details #details class="details" [open]="open()" (toggle)="toggled($event)">
  <summary class="line" [attr.data-testid]="ids().summary" (click)="shut($event)">
    @if (marked()) {
      <glz-icon class="icon" [class.glz-spin]="running()" [icon]="icon()" />
      <span class="fact state" [class.glz-visually-hidden]="quiet()">{{ label() }}</span>
    }
    @for (fact of facts(); track $index) {
      <span class="fact">{{ fact }}</span>
    }
    <span class="count"
      >{{ steps()
      }}<glz-icon class="chevron glz-mirrored" [attr.data-testid]="ids().chevron" [icon]="chevron"
    /></span>
  </summary>
  <div #fold class="fold" [attr.data-testid]="ids().fold">
    <div class="steps" [attr.data-testid]="ids().steps"><ng-content /></div>
  </div>
</details>
