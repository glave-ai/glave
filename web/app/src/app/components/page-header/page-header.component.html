<header>
  <glz-top-bar>
    @if (narrow()) {
      <button
        glzTopBarStart
        glzIconButton
        class="action"
        data-testid="page-menu"
        [label]="copy.menu"
        [attr.aria-expanded]="open()"
        [attr.aria-keyshortcuts]="shortcut"
        (click)="toggle()"
      >
        <glz-icon [icon]="icon" />
      </button>
    }
    <ng-content />
    <div glzTopBarEnd class="end"><ng-content select="[appPageHeaderEnd]" /></div>
  </glz-top-bar>
</header>
