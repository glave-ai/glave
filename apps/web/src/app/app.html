@switch (status()) {
  @case ('loading') {
    <main class="gate-loading">
      <div class="presence" aria-hidden="true">
        <div class="orb"></div>
      </div>
      <p class="gate-loading__text" role="status" aria-live="polite">One moment…</p>
    </main>
  }
  @case ('authed') {
    <app-hope-chat />
  }
  @default {
    <app-login />
  }
}
