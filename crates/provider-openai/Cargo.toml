[package]
name = "glave-provider-openai"
description = "glave's model provider for OpenAI-compatible chat completion APIs: OpenAI, OpenRouter, Ollama, llama.cpp, vLLM, LM Studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glave-event.workspace = true
glave-ports.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# A fake OpenAI-compatible server on 127.0.0.1, for tests in this and other crates.
fake-server = []

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt"] }

[[test]]
name = "client"
required-features = ["fake-server"]

[lints]
workspace = true
