[task]
name = "glave/web-search"
description = "The answer is on a page the person gave no address for, with web search on: the model searches the web with web_search, then reads the page it found with web_fetch."

[glave]
permissions = "auto"
# Search and web_fetch run outside the sandbox, so this takes nothing from them. It takes the one
# other way to the web, which reaches this repository and its answers.
network = false
# The page's address is only in the search's results (search.md), and the codename only on the
# page: the results reached the model labelled untrusted, and the answer could come only from
# reading the page.
checks = [
    { sent = "<untrusted>\\n1. Bramblewick 3.1 release notes" },
    { answer_contains = "Saffron Marten" },
]
