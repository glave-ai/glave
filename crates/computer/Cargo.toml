[package]
name = "glave-computer"
description = "glave's computers: this machine as a computer, people's computers on Kubernetes, and computers served and reached over JSON-RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one program, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "computer"
path = "tests/main.rs"

[dependencies]
# The outbound proxy's credential, which clients send as `Proxy-Authorization: Basic` (already
# in the tree).
base64.workspace = true
# The random part of new computer and workspace ids (UUID v7), and workers' tokens.
getrandom.workspace = true
# Whose a person's computer is, as its lease names them.
glave-event = { workspace = true, optional = true }
glave-ports.workspace = true
# Every process it starts: commands owned by their workspace and recorded while they run.
glave-process.workspace = true
# File patterns as models write them, for files/glob and files/search.
globset.workspace = true
# People's computers and workers on Kubernetes, only with the `kubernetes` feature (the CLI turns
# it on), so library users who never start one on a cluster do not build a Kubernetes client.
k8s-openapi = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
# Walking a workspace the way git sees it, leaving out what it ignores.
ignore.workspace = true
# A self-signed certificate for a computer served over TLS, whose fingerprint the harness pins.
rcgen.workspace = true
# The expressions files/search looks for.
regex.workspace = true
# Resolving every path one name at a time from an open handle on the workspace root
# (openat, no-follow), so a link swapped in by a command cannot lead a file tool outside.
# Process calls on Linux: the Landlock helper's own session and the user id that names the
# sandbox's folder and tmux's; and `setns`, by which a command joins its thread's network.
rustix = { workspace = true, features = ["process", "pty", "termios", "thread"] }
# TLS between the harness and a computer served across machines (already in the tree via reqwest).
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rustls.workspace = true
# A computer running another version of glave than the server's, said in the server's log.
tracing.workspace = true
uuid.workspace = true

# The sandbox on Linux: Landlock where bubblewrap cannot start, and the seccomp filter that
# blocks the network and escape-relevant syscalls inside either.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
libc.workspace = true
seccompiler.workspace = true

[features]
# People's computers, and workers, on Kubernetes.
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:glave-event"]

[dev-dependencies]
glave-ports = { workspace = true, features = ["conformance"] }
proptest.workspace = true
# TLS 1.2 for a test server that `curl` on Apple's Secure Transport, which has no TLS 1.3,
# reaches through the outbound proxy.
rustls = { workspace = true, features = ["tls12"] }
# A pseudo-terminal of the sandbox tests' own, standing in for another session's terminal.
rustix = { workspace = true, features = ["pty"] }
# Paused time, so fault tests stall and time out on a clock they move, never a real one.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
