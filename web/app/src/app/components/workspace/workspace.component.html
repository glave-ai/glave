<a class="skip" [href]="contentLink" data-testid="workspace-skip">{{ copy.skip }}</a>
<glz-sidenav-layout testId="workspace" [label]="copy.sideNav" [(open)]="navOpen">
  <app-side-nav
    glzSidenav
    class="side"
    [current]="currentThread()"
    [page]="currentPage()"
    (navigated)="navigated()"
  />
  <main id="content" class="content" tabindex="-1">
    <router-outlet />
  </main>
</glz-sidenav-layout>
