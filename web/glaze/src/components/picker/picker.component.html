<button
  #trigger
  type="button"
  class="trigger"
  aria-haspopup="dialog"
  [attr.data-testid]="ids().trigger"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="popoverId"
  [attr.popovertarget]="popoverId"
  [disabled]="disabled()"
  (click)="pressed($event)"
>
  <span class="glz-visually-hidden">{{ prefix() }}</span>
  <span class="text">{{ shownLabel() }}</span>
  <glz-icon class="chevron" [icon]="icons.open" />
</button>
<div
  #popover
  popover
  class="popover"
  role="dialog"
  [id]="popoverId"
  [attr.aria-label]="label()"
  (toggle)="toggled($event)"
>
  <input
    #search
    class="search"
    type="text"
    role="combobox"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    aria-autocomplete="list"
    [attr.data-testid]="ids().search"
    [attr.aria-label]="searchLabel()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="listboxId"
    [attr.aria-activedescendant]="activeId()"
    [placeholder]="searchLabel()"
    [value]="query()"
    (input)="typing($event)"
    (keydown)="keydown($event)"
  />
  <div
    class="list"
    role="listbox"
    [id]="listboxId"
    [attr.data-testid]="ids().listbox"
    [attr.aria-label]="label()"
  >
    @for (option of shown(); track option.value) {
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- the search box owns the keyboard through aria-activedescendant; options only take pointer clicks -->
      <div
        class="option"
        role="option"
        [id]="option.id"
        [class.active]="option.active"
        [attr.aria-selected]="option.selected"
        [attr.data-testid]="ids().option"
        (click)="choose(option.value)"
        (mousedown)="keepFocus($event)"
      >
        <span class="check">
          @if (option.selected) {
            <glz-icon [icon]="icons.check" />
          }
        </span>
        <span class="name">
          <span class="label">{{ option.label }}</span>
          @if (option.hasHint) {
            <span class="hint">{{ option.hint }}</span>
          }
        </span>
      </div>
    } @empty {
      <div class="empty" role="presentation" [attr.data-testid]="ids().empty">
        {{ emptyText() }}
      </div>
    }
  </div>
</div>
