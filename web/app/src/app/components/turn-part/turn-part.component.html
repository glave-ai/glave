@let shown = part();
@switch (shown.kind) {
  @case ('run') {
    @let told = line();
    <glz-steps plain testId="thread-run" [steps]="told.words" [pending]="told.pending">
      @for (item of shown.items; track item.key) {
        <app-thread-item [item]="item" />
      }
    </glz-steps>
  }
  @case ('item') {
    <app-thread-item [item]="shown.item" [interim]="shown.interim" />
    @if (shown.sources; as sources) {
      <app-reply-sources [sources]="sources" />
    }
  }
}
@for (shown of images(); track shown.image.sha256) {
  <!-- Loaded apart from the app's first load, in a frame of its size meanwhile. -->
  @defer (on immediate) {
    <app-thread-image [image]="shown.image" [alt]="shown.alt" />
  } @placeholder {
    <span class="image-room"></span>
  }
}
