[package]
name = "glave-eval"
description = "glave's eval factory: the harness run in-process on task folders against real models, graded without a judge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "glave-eval"
path = "src/main.rs"

[dependencies]
glave-event.workspace = true
glave-harness.workspace = true
glave-ports.workspace = true
glave-provider-openai.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "rt-multi-thread", "sync", "time"] }
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
glave-provider-openai = { workspace = true, features = ["fake-server"] }

[lints]
workspace = true
