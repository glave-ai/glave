<app-page-header />
<div class="home">
  <h1 class="heading">{{ copy.heading }}</h1>
  @if (error(); as error) {
    <p class="error" role="alert" data-testid="home-error">{{ copy.failed }} {{ error }}</p>
  }
  <glz-composer
    class="composer"
    testId="home-composer"
    size="lg"
    [placeholder]="copy.placeholder"
    [disabled]="starting()"
    [(value)]="draft"
    (send)="send($event)"
  >
    @if (whereInBox()) {
      <glz-menu-select
        glzComposerStart
        testId="home-where"
        outlined
        [label]="copy.where"
        [options]="places()"
        [(value)]="where"
      />
    }
    @if (whereInStatus()) {
      <glz-menu-select
        glzComposerStatus
        testId="home-where"
        outlined
        [label]="copy.where"
        [options]="places()"
        [(value)]="where"
      />
    }
    <app-approval-mode glzComposerStatus [(value)]="pickedMode" />
    <app-model-picker glzComposerStatus [(value)]="picked" />
    <app-effort-picker glzComposerStatus [model]="picked()" [(value)]="pickedEffort" />
  </glz-composer>
  @if (local()) {
    <p class="private" data-testid="home-private">
      <glz-icon [icon]="lock" />
      {{ copy.private }}
    </p>
  }
</div>
