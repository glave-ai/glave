<a class="skip" [href]="contentLink" data-testid="workspace-skip">{{ copy.skip }}</a>
<glz-sidenav-layout
  testId="workspace"
  [label]="copy.sideNav"
  [resizeLabel]="copy.resize"
  [resizeHint]="hint"
  [shortcut]="shortcut"
  [(open)]="navOpen"
  [(width)]="navWidth"
>
  <app-side-nav
    glzSidenav
    class="side"
    [current]="currentThread()"
    [page]="currentPage()"
    (navigated)="navigated()"
  />
  <main id="content" class="content" tabindex="-1">
    <router-outlet />
  </main>
</glz-sidenav-layout>
@defer (when offering()) {
  <app-passkey-offer />
}
