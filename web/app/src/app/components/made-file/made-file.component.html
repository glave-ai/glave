<div class="file" data-testid="made-file" [class.selected]="selected()">
  <glz-icon class="mark" [icon]="mark()" />
  <span class="text">
    <span class="title" dir="auto" data-testid="made-file-title">{{ file().name }}</span>
    <span class="line" data-testid="made-file-line" [class.reason]="reason()">{{ line() }}</span>
  </span>
  <span class="actions">
    @if (opens()) {
      <button
        glzButton
        size="sm"
        class="open"
        data-testid="made-file-open"
        [attr.aria-label]="openLabel()"
        (click)="open()"
      >
        {{ copy.open }}
      </button>
    }
    @if (shareOf()) {
      <button
        glzButton
        size="sm"
        class="share"
        data-testid="made-file-share"
        [attr.aria-label]="shareLabel()"
        (click)="share()"
      >
        {{ copy.share }}
      </button>
    }
    @if (kept()) {
      <button
        glzIconButton
        size="sm"
        class="download"
        data-testid="made-file-download"
        [label]="downloadLabel()"
        [attr.aria-busy]="busy()"
        (click)="download()"
      >
        <glz-icon [icon]="icons.download" />
      </button>
    }
  </span>
</div>
@if (sharedOf(); as of) {
  <app-share-dialog [of]="of" [name]="file().name" [(open)]="sharing" (changed)="shared()" />
}
