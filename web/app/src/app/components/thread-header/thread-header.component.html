<header class="bar" [class.phone]="phone()">
  @if (phone()) {
    <button
      glzIconButton
      class="touch"
      data-testid="page-menu"
      [label]="copy.menu"
      [attr.aria-expanded]="navOpen()"
      [attr.aria-keyshortcuts]="navShortcut"
      (click)="toggleNav()"
    >
      <glz-icon [icon]="icons.menu" />
    </button>
  }
  <div class="heading">
    <h1 class="title" data-testid="thread-title">
      <button
        type="button"
        class="rename"
        data-testid="thread-rename"
        [glzTooltip]="copy.rename"
        (click)="startRename()"
      >
        <span dir="auto">{{ title() }}</span>
      </button>
    </h1>
    @if (project(); as project) {
      <p class="meta" data-testid="thread-meta">
        <glz-icon class="folder" [icon]="icons.folder" />
        <span class="where">{{ project }}</span>
      </p>
    }
  </div>
  @if (panel()) {
    <button
      glzIconButton
      data-testid="thread-panel"
      [class.touch]="phone()"
      [label]="copy.panel"
      [attr.aria-pressed]="pressed()"
      [attr.aria-expanded]="expanded()"
      [attr.aria-keyshortcuts]="panelShortcut"
      (click)="togglePanel()"
    >
      <glz-icon class="glz-mirrored" [icon]="icons.panel" />
    </button>
  }
</header>
