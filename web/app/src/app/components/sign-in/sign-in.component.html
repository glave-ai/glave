<header>
  <glz-top-bar>
    <span class="name" data-testid="sign-in-name">{{ copy.name }}</span>
    <a glzTopBarEnd class="about" data-testid="sign-in-about" [href]="aboutLink">{{
      copy.about
    }}</a>
  </glz-top-bar>
</header>
<main class="page">
  <div class="column glz-stack glz-gap-6" data-testid="sign-in">
    <div class="words glz-stack glz-gap-4">
      <h1 class="headline">{{ heading() }}</h1>
      <p class="lede">{{ lede() }}</p>
    </div>
    @if (problem(); as problem) {
      <p class="problem" role="alert" data-testid="sign-in-problem">{{ problem }}</p>
    }
    @if (withPasskey()) {
      <div class="glz-stack glz-gap-3">
        <button
          glzButton
          variant="primary"
          size="lg"
          data-testid="sign-in-passkey"
          [disabled]="busy()"
          (click)="go()"
        >
          <glz-icon [icon]="key" />
          {{ action() }}
        </button>
        @if (signsUp()) {
          <a glzButton size="lg" data-testid="sign-in-sign-up" [routerLink]="signUpLink">{{
            copy.signUp
          }}</a>
        }
      </div>
    }
    @if (recovers()) {
      <p class="note">
        {{ copy.lost }}
        <a data-testid="sign-in-recover" [routerLink]="recoverLink">{{ copy.recover }}</a>
      </p>
    }
    @if (note(); as note) {
      <p class="note" data-testid="sign-in-note">{{ note }}</p>
    }
  </div>
</main>
