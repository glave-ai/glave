[package]
name = "glave-session"
description = "glave's session API: the one boundary every surface uses to run threads and turns, over any transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glave-event.workspace = true
glave-harness.workspace = true
glave-ports.workspace = true
# The HTTP transport's server.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff.workspace = true
# Verifying sign-in tokens against the identity provider's keys.
jsonwebtoken.workspace = true
# Fetching an identity provider's discovery document and keys.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The scheduler waits for the next due run with a timer.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
aws-lc-rs.workspace = true
glave-computer.workspace = true
glave-keys.workspace = true
glave-store-sqlite.workspace = true
# Property tests for the cron parser (AGENTS.md: parsers get property tests).
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
uuid.workspace = true

[lints]
workspace = true
