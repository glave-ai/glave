[package]
name = "glave-computer"
description = "glave's computers: this machine as a computer, environments read from environment.toml or devcontainer.json, workers on Docker or Kubernetes, and computers served and reached over JSON-RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one program, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "computer"
path = "tests/main.rs"

[dependencies]
# Request and response bodies for the Docker Engine API (already in the tree via reqwest).
bytes.workspace = true
# The random part of new computer and workspace ids (UUID v7), and workers' tokens.
getrandom.workspace = true
# Whose a person's computer is, as its lease names them.
glave-event = { workspace = true, optional = true }
glave-ports.workspace = true
# Every process it starts: commands owned by their workspace and recorded while they run.
glave-process.workspace = true
# File patterns as models write them, for files/glob and files/search.
globset.workspace = true
# The Docker Engine API, over its Unix socket (already in the tree via reqwest).
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# Workers on Kubernetes, only with the `kubernetes` feature (the CLI turns it on), so library
# users who never start a worker on a cluster do not build a Kubernetes client.
k8s-openapi = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
# Walking a workspace the way git sees it, leaving out what it ignores.
ignore.workspace = true
# A self-signed certificate per worker, whose fingerprint the harness pins.
rcgen.workspace = true
# The expressions files/search looks for.
regex.workspace = true
# Resolving every path one name at a time from an open handle on the workspace root
# (openat, no-follow), so a link swapped in by a command cannot lead a file tool outside.
# Process calls on Linux: the Landlock helper's own session and the user id that names the
# sandbox's folder.
rustix = { workspace = true, features = ["process"] }
# TLS between the harness and a worker (already in the tree via reqwest).
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-rustls.workspace = true
# Reading .glave/environment.toml.
toml.workspace = true
uuid.workspace = true

# The sandbox on Linux: Landlock where bubblewrap cannot start, and the seccomp filter that
# blocks the network and escape-relevant syscalls inside either.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
libc.workspace = true
seccompiler.workspace = true

[features]
# The worker backend on Kubernetes.
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:glave-event"]

[dev-dependencies]
glave-ports = { workspace = true, features = ["conformance"] }
proptest.workspace = true
# Paused time, so fault tests stall and time out on a clock they move, never a real one.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
