<main class="hope">
  <div class="presence" aria-hidden="true">
    <div class="orb"></div>
  </div>

  <section class="thread" aria-live="polite">
    @for (msg of messages(); track $index) {
      <p
        class="bubble"
        [class.bubble--you]="msg.from === 'you'"
        [class.bubble--hope]="msg.from === 'hope'"
      >
        {{ msg.text }}
      </p>
    }
  </section>

  <div class="composer">
    <mat-form-field appearance="outline" class="composer__field">
      <mat-label>Talk to Hope</mat-label>
      <input
        matInput
        #box
        [value]="draft()"
        (input)="draft.set(box.value)"
        (keyup.enter)="send()"
      />
    </mat-form-field>
    <button mat-flat-button class="composer__send" (click)="send()">Ask Hope</button>
  </div>
</main>
