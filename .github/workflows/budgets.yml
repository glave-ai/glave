name: budgets

# The performance budgets in AGENTS.md, set in crates/session/benches/budgets.rs and measured in
# the merge queue, after every merge to main, weekly, and on demand. A pull request is not
# measured: `budgets`, the check the `main` ruleset requires, passes on it at once, and the
# merge queue measures the change before it merges, on top of the ones ahead of it.
# The binary's size and the answered command are measured on the build that ships: glave for
# x86-64 Linux as the release builds it (dist-workspace.toml), static with musl, in the dist
# profile, with the web app inside. The benchmark is built for musl too, so the thread it
# resumes runs on the allocator a released glave's does (crates/cli/src/allocator.rs). The two
# optimized builds are what cost, about 5 minutes each, nearly all of it LTO, and on one runner
# they slow each other down: so each has a runner of its own, at the same time, and a third
# measures, in seconds.
# The numbers are wall-clock, and depend on the kind of machine the measuring job is given,
# which it names.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run still going; pushes to main always finish.
concurrency:
  group: budgets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  # What the release builds glave for on x86-64 Linux (dist-workspace.toml, `targets`).
  TARGET: x86_64-unknown-linux-musl

# Every job has a timeout of about three times its longest run (October 2026), so a hang fails
# in minutes rather than holding the merge queue for GitHub's six hours.
jobs:
  release:
    if: github.event_name != 'pull_request'
    # The runner the release builds x86-64 Linux on (dist's plan), so its C compiler and musl.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml), with musl's standard library
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      # The C in glave's dependencies is compiled for musl with musl's own compiler wrapper, as
      # the release build installs it.
      - name: Install musl-gcc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
      # Saved from main only, as in ci.yml: per-PR copies would fill the repository's cache. Its
      # key names the target, and the job's name keeps this build's apart from the benchmark's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.TARGET }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app, which the binary carries
        run: npm ci && npm run build
        working-directory: web
      # As dist builds it: the glave package alone (`precise-builds`), with its `web` feature
      # (crates/cli/Cargo.toml, [package.metadata.dist]), in the dist profile, with the flags
      # dist sets for a musl target (today's defaults, which dist keeps in case they change).
      - name: Build glave as the release does
        run: cargo build --profile dist --target "$TARGET" -p glave --features web
        env:
          RUSTFLAGS: -Ctarget-feature=+crt-static -Clink-self-contained=yes
      - uses: actions/upload-artifact@v7
        with:
          name: glave
          path: target/${{ env.TARGET }}/dist/glave
          if-no-files-found: error
          retention-days: 1

  benchmark:
    if: github.event_name != 'pull_request'
    # As the release's, so the same C compiler and musl.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml), with musl's standard library
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Install musl-gcc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.TARGET }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Built, not run, through `cargo xtask bench`: the benchmark alone, in a package with no
      # program of its own, so no glave is linked beside it; the one measured is the release's.
      - name: Build the benchmark
        run: |
          cargo xtask bench --bench budgets --target "$TARGET" --no-run \
            --message-format=json-render-diagnostics > built.json
          mkdir benchmark
          cp "$(jq -r 'select(.target.name == "budgets" and .executable) | .executable' built.json)" benchmark/budgets
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmark/budgets
          if-no-files-found: error
          retention-days: 1

  # On a runner nothing else uses, which is what `cargo xtask bench`'s lock is for elsewhere.
  measure:
    needs: [release, benchmark]
    runs-on: ubuntu-22.04
    # It takes seconds; the benchmark bounds its own waits, and this the rest.
    timeout-minutes: 10
    steps:
      # Each into a folder of its own name; the files lose their mode on the way.
      - uses: actions/download-artifact@v8
      - name: Measure it
        run: |
          chmod +x glave/glave benchmark/budgets
          echo "measured on $(nproc) cores of $(lscpu | sed -n 's/^Model name: *//p')"
          benchmark/budgets
        env:
          GLAVE_BUDGETS_BINARY: glave/glave

  # The check the ruleset requires: on a pull request it passes at once, and everywhere else
  # only when `measure` did.
  budgets:
    if: always()
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Within budget
        env:
          EVENT: ${{ github.event_name }}
          MEASURE: ${{ needs.measure.result }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "Not measured on a pull request: budgets are measured in the merge queue, before the change merges, then after the merge to main and weekly."
            exit 0
          fi
          echo "measured: $MEASURE"
          test "$MEASURE" = success
