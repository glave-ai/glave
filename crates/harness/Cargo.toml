[package]
name = "glave-harness"
description = "glave's agent loop: the tools, approvals, and every step recorded as events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one program, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "harness"
path = "tests/main.rs"

[dependencies]
# Images sent to the model inline, in base64 (already in the tree).
base64.workspace = true
glave-event.workspace = true
glave-ports.workspace = true
glave-shell.workspace = true
# Content-free spans and metrics: turns, tool calls, commands, approvals.
tracing.workspace = true
jiff.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
# Reading back the ids in a worktree's owner label (already in every glave crate's tree).
uuid.workspace = true

[dev-dependencies]
# Tests run the tools on this machine as a computer, as the CLI does.
glave-computer.workspace = true
glave-ports = { workspace = true, features = ["conformance"] }
proptest.workspace = true

[lints]
workspace = true
