name: sandbox

# The macOS sandbox's tests (Linux's run in ci.yml's sandbox-linux job on every push). macOS
# minutes cost 10x on private repos, so pull requests run them only when they touch the
# sandbox or what it wraps. `main` runs them in the full macOS job.
on:
  pull_request:
    paths:
      - crates/harness/src/sandbox.rs
      - crates/harness/src/sandbox/**
      - crates/harness/src/tools/bash.rs
      - crates/harness/src/tools/workspace.rs
      - crates/computer/src/local/sandbox.rs
      - crates/computer/src/local/sandbox/**
      - crates/computer/src/local/command.rs
      - .github/workflows/sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"

# Every job has a timeout of about three times its longest run (October 2026), so a hang fails
# in minutes rather than holding the merge queue for GitHub's six hours.
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      # Fail, never skip, if the sandbox is unavailable on the runner.
      GLAVE_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p glave-harness
      - run: cargo nextest run -p glave-computer -E 'test(/sandbox/)'
