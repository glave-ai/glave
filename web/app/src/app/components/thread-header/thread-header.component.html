<header class="bar" [class.phone]="phone()">
  @if (phone()) {
    <button
      glzIconButton
      class="touch"
      data-testid="page-menu"
      [label]="copy.menu"
      [attr.aria-expanded]="navOpen()"
      [attr.aria-keyshortcuts]="navShortcut"
      (click)="toggleNav()"
    >
      <glz-icon [icon]="icons.menu" />
    </button>
  }
  <div class="heading">
    <h1 #heading class="title" data-testid="thread-title" tabindex="-1">
      <button
        type="button"
        class="rename"
        data-testid="thread-rename"
        [glzTooltip]="copy.rename"
        (click)="startRename()"
      >
        <span dir="auto">{{ title() }}</span>
      </button>
    </h1>
    @if (meta()) {
      <div class="meta" data-testid="thread-meta">
        @if (project(); as project) {
          <span class="part">
            <glz-icon class="folder" [icon]="icons.folder" />
            <span class="words">{{ project }}</span>
          </span>
        }
        @if (line(); as line) {
          <span class="part" data-testid="thread-repeats">
            <glz-icon [icon]="icons.repeat" />
            <span class="words">{{ line }}</span>
          </span>
        }
        @if (buttons(); as schedule) {
          <app-schedule-actions
            testId="thread-repeats"
            [schedule]="schedule"
            [(error)]="error"
            (changed)="changed($event)"
            (removed)="removed()"
          />
        }
      </div>
    }
  </div>
  @if (menu(); as schedule) {
    <app-schedule-actions
      menu
      class="touch"
      testId="thread-repeats"
      [schedule]="schedule"
      [extras]="extras()"
      [(error)]="error"
      (extra)="extra($event)"
      (changed)="changed($event)"
      (removed)="removed()"
    />
  }
  @if (panelButton()) {
    <button
      glzIconButton
      data-testid="thread-panel"
      [class.touch]="phone()"
      [label]="copy.panel"
      [attr.aria-pressed]="pressed()"
      [attr.aria-expanded]="expanded()"
      [attr.aria-keyshortcuts]="panelShortcut"
      (click)="togglePanel()"
    >
      <glz-icon class="glz-mirrored" [icon]="icons.panel" />
    </button>
  }
</header>
@if (error(); as error) {
  <p class="error" role="alert" data-testid="thread-repeats-error">{{ error }}</p>
}
