<div class="person" data-testid="person">
  <span class="avatar" aria-hidden="true"><glz-avatar size="sm" [name]="copy.you" /></span>
  <span class="who">
    <span class="name">{{ copy.you }}</span>
    <span class="how">{{ copy.signedIn }}</span>
  </span>
  <button glzIconButton data-testid="person-sign-out" [label]="copy.signOut" (click)="signOut()">
    <glz-icon [icon]="signOutIcon" />
  </button>
</div>
