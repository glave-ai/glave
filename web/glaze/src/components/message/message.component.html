<div class="main">
  @if (showAuthor()) {
    <p class="author" aria-hidden="true">
      {{ author() }}
      @if (hope()) {
        <span class="sun"></span>
      }
    </p>
  }
  <div class="body">
    <ng-content />
    @if (streaming()) {
      <span class="caret" aria-hidden="true"></span>
    }
  </div>
</div>
