<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- a click on the dialog itself is on its backdrop; Escape closes it natively -->
<dialog
  #dialog
  [attr.data-testid]="testId()"
  class="dialog"
  [attr.aria-labelledby]="headingId"
  (close)="closed()"
  (click)="clicked($event)"
>
  <div class="surface">
    <div class="header">
      <h2 class="heading" [id]="headingId">{{ heading() }}</h2>
      <button glzIconButton [attr.data-testid]="ids().close" [label]="closeLabel" (click)="close()">
        <glz-icon [icon]="closeIcon" />
      </button>
    </div>
    <div class="content"><ng-content /></div>
    <div class="actions"><ng-content select="[glzDialogActions]" /></div>
  </div>
</dialog>
