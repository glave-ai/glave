[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/glave-ai/glave"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Safety lints are "forbid": no attribute anywhere in the code can switch them off.
# Tests get their exemptions only through clippy.toml, never through attributes.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"   # #[must_use] ceremony, not safety
missing_errors_doc = "allow"   # `# Errors` doc sections, not safety
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unwrap_in_result = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
exit = "forbid"                # return an ExitCode from main instead
mod_module_files = "forbid"    # `foo.rs` + `foo/`, never `mod.rs`
allow_attributes = "forbid"    # no #[allow] at all; see AGENTS.md for #[expect]
allow_attributes_without_reason = "deny"

[workspace.dependencies]
anyhow = "1"
# Only for tests: signing tokens as a fake identity provider. rustls already builds it.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "ring-io"] }
bytes = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
glave-computer = { path = "crates/computer" }
glave-config = { path = "crates/config" }
glave-event = { path = "crates/event" }
glave-gateway = { path = "crates/gateway" }
glave-gateway-service = { path = "crates/gateway-service" }
glave-harness = { path = "crates/harness" }
glave-identity = { path = "crates/identity" }
glave-keys = { path = "crates/keys" }
glave-mcp = { path = "crates/mcp" }
glave-memory = { path = "crates/memory" }
glave-ports = { path = "crates/ports" }
glave-provider-anthropic = { path = "crates/provider-anthropic" }
glave-provider-openai = { path = "crates/provider-openai" }
glave-session = { path = "crates/session" }
glave-shell = { path = "crates/shell" }
glave-store-sqlite = { path = "crates/store-sqlite" }
glave-web = { path = "crates/web" }
getrandom = "0.4"
globset = "0.4"
hmac = "0.13"
# HTML to Markdown for web_fetch: small, maintained, Turndown's design, on html5ever.
htmd = "0.5"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
ignore = "0.4"
# Snapshot tests for stable text formats (AGENTS.md). Dev only; no default features.
insta = { version = "1", default-features = false }
# Verifying OIDC tokens, on aws-lc-rs, the crypto rustls already uses.
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
# The Linux sandbox's Landlock fallback, where bubblewrap cannot start (Linux only).
landlock = "0.4.7"
# Syscall numbers and socket families for the Linux sandbox's seccomp filter (already in the
# tree through tokio, seccompiler and landlock).
libc = "0.2"
# Kubernetes types for the worker backend on Kubernetes: the API at its oldest supported version.
k8s-openapi = { version = "0.28", default-features = false, features = ["std", "earliest"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
# The Kubernetes client for the worker backend on Kubernetes: kubeconfig and in-cluster auth,
# rustls on aws-lc-rs as the rest of glave, and WebSockets for exec, attach and port-forward.
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "ws"] }
proptest = "1"
# Self-signed certificates for workers, on aws-lc-rs, the crypto rustls already uses.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1"
rmcp = { version = "3.5.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
# Files opened one name at a time from a folder handle (openat), for confinement.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
# The Linux sandbox's seccomp filter, built and compiled to BPF in safe Rust (Firecracker's).
seccompiler = { version = "0.5", default-features = false }
# JSON Schema of the session API, derived beside serde (already in the tree, under rmcp).
schemars = { version = "1.2", default-features = false, features = ["derive", "std", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-jiff-0_2", "with-uuid-1"] }
toml = { version = "1", default-features = false, features = ["display", "parse", "serde", "std"] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
url = "2"
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
zeroize = "1"

# Day-to-day builds: file and line numbers in backtraces, no full debug info
# for dependencies. Roughly 40% smaller `target/` (measured on the legacy tree).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Full debug info for stepping through code: `cargo build --profile debugging`.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
