<label class="choice">
  <input
    type="radio"
    class="native"
    [name]="group.groupName"
    [value]="value()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    (change)="pick()"
    (blur)="blurred()"
  />
  <span class="mark" aria-hidden="true"></span>
  <span class="text"><ng-content /></span>
</label>
