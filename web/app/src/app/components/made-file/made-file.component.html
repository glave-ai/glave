<div class="file" data-testid="made-file">
  <glz-icon class="mark" [icon]="mark()" />
  <span class="text">
    <span class="title" dir="auto" data-testid="made-file-title">{{ file().title }}</span>
    <span class="line" data-testid="made-file-line">{{ line() }}</span>
  </span>
  <span class="actions">
    <button glzButton size="sm" data-testid="made-file-open" (click)="open()">
      {{ copy.open }}
    </button>
    <button
      glzIconButton
      size="sm"
      data-testid="made-file-download"
      [label]="downloadLabel()"
      (click)="download()"
    >
      <glz-icon [icon]="icons.download" />
    </button>
  </span>
</div>
