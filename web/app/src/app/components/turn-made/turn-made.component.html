@for (drawn of cards(); track drawn.card.key) {
  <!-- Until the server describes it, a card is its room, unseen. -->
  <app-made-file [class.room]="drawn.room" [file]="drawn.card.file" />
}
@if (folds()) {
  <button
    type="button"
    class="fold"
    data-testid="turn-made-fold"
    [class.room]="foldRoom()"
    [attr.aria-expanded]="unfolded()"
    (click)="toggle()"
  >
    <span>{{ foldLabel() }}</span>
    <glz-icon [icon]="foldIcon()" />
  </button>
}
@if (note(); as note) {
  <div class="notes">
    <p class="note" data-testid="turn-made-note" [class.room]="noteRoom()">{{ note }}</p>
  </div>
}
