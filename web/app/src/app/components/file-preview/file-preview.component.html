<section class="preview" data-testid="file-preview">
  <div class="head">
    <h3 class="title" dir="auto" data-testid="file-preview-title">{{ file().title }}</h3>
    <button glzButton size="sm" data-testid="file-preview-download" (click)="download()">
      {{ copy.download }}
    </button>
  </div>
  @if (failed(); as why) {
    <p class="note" data-testid="file-preview-failed">{{ why }}</p>
  } @else if (frame(); as url) {
    <iframe
      class="frame"
      data-testid="file-preview-frame"
      [src]="url"
      [title]="file().title"
    ></iframe>
  } @else if (markdown(); as text) {
    <div class="page" testId="file-preview-markdown" [glzMarkdown]="text"></div>
  } @else {
    <p class="note" data-testid="file-preview-opening">{{ copy.opening }}</p>
  }
</section>
