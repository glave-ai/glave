<div class="file" data-testid="made-file" [class.selected]="selected()">
  <glz-icon class="mark" [icon]="mark()" />
  <span class="text">
    <span class="title" dir="auto" data-testid="made-file-title">{{ file().name }}</span>
    <span class="line" data-testid="made-file-line">{{ line() }}</span>
  </span>
  <span class="actions">
    @if (opens()) {
      <button
        glzButton
        size="sm"
        class="open"
        data-testid="made-file-open"
        [attr.aria-label]="openLabel()"
        (click)="open()"
      >
        {{ copy.open }}
      </button>
    }
    @if (kept()) {
      <button
        glzIconButton
        size="sm"
        class="download"
        data-testid="made-file-download"
        [label]="downloadLabel()"
        (click)="download()"
      >
        <glz-icon [icon]="icons.download" />
      </button>
    }
  </span>
</div>
