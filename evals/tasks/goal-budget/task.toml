[task]
name = "glave/goal-budget"
description = "A goal that cannot be met ends without being called met: the model pauses it to tell the person, or it stops at its token budget, or as stalled when the model stops trying."

[agent]
timeout_sec = 600

[glave]
permissions = "auto"
# No whole number squares to 2, so the goal can never be met.
goal = { budget = 60000 }
checks = [{ goal_ended = ["paused", "budget", "stalled"] }]
