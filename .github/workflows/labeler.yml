name: labeler

# pull_request_target so labels work on pull requests from forks too. Safe here: the labeler
# reads the list of changed files and never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# github.ref is the base branch under pull_request_target, so runs group by pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
