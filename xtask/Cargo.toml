[package]
name = "xtask"
description = "Developer automation for the Glave workspace: `cargo xtask <command>`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
# The one list of the prefixes providers put on keys and tokens, which the secret scan reads,
# the one clock (`cargo xtask package-age`), and (`conformance`) the fake HTTP server `try-org`'s
# stand-in model answers from, and the temp folders and the guard against a hang the tests share.
glave-ports = { workspace = true, features = ["conformance"] }
# What xtask runs to its end (the builds, the tests, the web checks, the evals) ends with xtask,
# however xtask ends: glave's lifeline.
glave-process.workspace = true
# When a package version was published, as crates.io and the npm registry say, and how old it
# is (`cargo xtask package-age`; already in the tree, under glave-ports).
jiff.workspace = true
# Reading JSON: the generated API schema the web client's types are written from, and
# package-lock.json, the registries' answers and GitHub's event (`cargo xtask package-age`).
serde_json.workspace = true
# Reading the items each library crate exports (`cargo xtask unused-pub`; already in the
# tree, under the derive macros).
syn.workspace = true
# The runtime glave-process starts and waits for programs on, the limit a query has, and the
# signals that stop `try-org`.
tokio = { workspace = true, features = ["io-util", "rt", "signal", "time"] }
# Reading Cargo.lock (`cargo xtask package-age`; already in the tree, under glave-config).
toml.workspace = true

[[test]]
name = "xtask"
path = "tests/main.rs"

[lints]
workspace = true
