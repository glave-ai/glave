<div class="tablist" role="tablist" [attr.aria-label]="label()">
  @for (tab of shown(); track tab.tabId) {
    <button
      #tab
      type="button"
      class="tab"
      role="tab"
      [attr.data-testid]="ids().tab"
      [id]="tab.tabId"
      [attr.aria-selected]="tab.selected"
      [attr.aria-controls]="tab.controls"
      [tabIndex]="tab.tabIndex"
      (click)="select(tab.index)"
      (keydown)="keydown($event)"
    >
      {{ tab.label }}
    </button>
  }
</div>
@if (current(); as tab) {
  <div
    class="panel"
    role="tabpanel"
    tabindex="0"
    [attr.data-testid]="ids().panel"
    [id]="tab.panelId"
    [attr.aria-labelledby]="tab.tabId"
  >
    <ng-container [ngTemplateOutlet]="tab.content" />
  </div>
}
