[package]
name = "glave-eval"
description = "glave's eval factory: the harness run in-process on task folders against real models, graded without a judge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one program, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "eval"
path = "tests/main.rs"

[[bin]]
name = "glave-eval"
path = "src/main.rs"

[dependencies]
glave-computer.workspace = true
glave-event.workspace = true
glave-harness.workspace = true
# Each attempt keeps its memory in a sealed store of its own, as glave does.
glave-keys.workspace = true
glave-memory.workspace = true
# The secret a task's `{canary}` becomes, a fake made as it loads (`testing`).
glave-ports = { workspace = true, features = ["conformance"] }
# Setup scripts, run to the end.
glave-process.workspace = true
glave-provider-openai.workspace = true
glave-shell.workspace = true
glave-store-sqlite.workspace = true
# web_fetch, and a task's pages served on 127.0.0.1.
glave-web = { workspace = true, features = ["pages"] }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "sync", "time"] }
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
glave-provider-openai = { workspace = true, features = ["fake-server"] }

[lints]
workspace = true
