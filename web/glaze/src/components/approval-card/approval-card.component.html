<div class="header">
  <glz-icon class="icon" [icon]="icon" />
  <p class="heading" [id]="headingId">{{ heading() }}</p>
</div>
<p class="summary">
  @if (tool()) {
    <span class="tool">{{ tool() }}</span>
  }
  {{ summary() }}
</p>
<div class="detail"><ng-content /></div>
@if (decidedText(); as decided) {
  <p class="decided" [attr.data-testid]="ids().decided">{{ decided }}</p>
} @else {
  <div class="actions">
    <button glzButton [attr.data-testid]="ids().deny" [disabled]="busy()" (click)="deny()">
      {{ denyLabel() }}
    </button>
    <button
      glzButton
      [attr.data-testid]="ids().allowThread"
      [disabled]="busy()"
      (click)="allowForThread()"
    >
      {{ allowForThreadLabel() }}
    </button>
    <button
      glzButton
      variant="primary"
      [attr.data-testid]="ids().allowOnce"
      [disabled]="busy()"
      (click)="allowOnce()"
    >
      {{ allowOnceLabel() }}
    </button>
  </div>
}
