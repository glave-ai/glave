# glave's own price list (specs/gateway.md, "Prices"): what each model costs at each maker Glave
# Cloud pays directly, as the maker's own page says. Built into glave, never fetched.
#
# An entry is a service, as receipts name it, and a model, by its own id at that service. Prices
# are US dollars per million tokens, written as decimal text so they are read exactly:
#   input, output                 every entry that isn't priced per request alone
#   cache_read, cache_write       where billed apart; a cache write at the price of the
#                                 maker's shortest cache (Anthropic's five minutes, OpenAI's 30)
#   image_output                  image tokens made, for a model billed by the image token
#   per_request                   one request
#   long                          the prices of every token of a call whose prompt is over
#                                 `above` tokens
# `date` is the day the price last changed, as a person checked it against `page` then. The
# entries seeded on 2026-11-24 carry the day they were checked, since the pages don't say when
# a price last changed. Batch, flex, priority and regional prices are not glave's: it sends none.

# Anthropic: Claude. Mythos models are left out, offered only to verified organizations.

