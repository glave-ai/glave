<section class="card" [attr.data-testid]="testId()" [attr.aria-labelledby]="headingId">
  <div class="head">
    @if (third()) {
      <h3 class="heading" [id]="headingId">{{ title() }}</h3>
    } @else {
      <h2 class="heading" [id]="headingId">{{ title() }}</h2>
    }
    <span class="count" [attr.data-testid]="ids().count">{{ count() }}</span>
    <span class="counts" aria-hidden="true"
      ><span class="plus" [glzCount]="total().added" [glzCountFormat]="marks.added"></span
      ><span class="minus" [glzCount]="total().removed" [glzCountFormat]="marks.removed"></span
    ></span>
    <span class="glz-visually-hidden">{{ total().label }}</span>
  </div>
  <ul class="rows">
    @for (row of rows(); track row.path) {
      <li class="file">
        <button type="button" class="row" [attr.data-testid]="ids().file" (click)="show(row.path)">
          <span class="path">{{ row.path }}</span>
          <span class="counts" aria-hidden="true"
            ><span class="plus" [glzCount]="row.added" [glzCountFormat]="marks.added"></span
            ><span class="minus" [glzCount]="row.removed" [glzCountFormat]="marks.removed"></span
          ></span>
          <span class="glz-visually-hidden">{{ row.label }}</span>
        </button>
      </li>
    }
  </ul>
  @if (more(); as more) {
    <button type="button" class="more" [attr.data-testid]="ids().more" (click)="show(null)">
      {{ more }}
    </button>
  }
  <div class="foot"><ng-content select="[appTurnChangesFoot]" /></div>
</section>
