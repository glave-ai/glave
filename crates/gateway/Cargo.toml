[package]
name = "glave-gateway"
description = "glave's gateway, in-process: routes model calls by purpose, falls back safely, meters every call and keeps budgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one program, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "gateway"
path = "tests/main.rs"

[dependencies]
glave-event.workspace = true
glave-ports.workspace = true
# The calendar month, in UTC, an organization's credits' monthly limit counts (already in the
# tree, under glave-ports).
jiff.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# A content-free span and metrics for each model call.
tracing.workspace = true

[dev-dependencies]
glave-ports = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["rt", "sync"] }

[[bench]]
name = "overhead"
harness = false

[lints]
workspace = true
