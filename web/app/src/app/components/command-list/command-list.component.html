@if (service.error(); as error) {
  <p class="error" role="alert" data-testid="commands-error">{{ error }}</p>
}
<ul class="list">
  @for (row of rows(); track row.id) {
    <li class="command" data-testid="command" [attr.aria-busy]="row.ariaBusy">
      <div class="row">
        <glz-icon class="glz-spin mark" [icon]="icons.running" />
        <code class="text" tabindex="0" data-testid="command-text" [glzTooltip]="row.command">{{
          row.command
        }}</code>
        @if (row.time; as time) {
          <span class="time" data-testid="command-time">{{ time }}</span>
        }
        <button
          glzIconButton
          size="sm"
          variant="secondary"
          data-testid="command-stop"
          [label]="row.actionLabel"
          [disabled]="row.busy"
          (click)="stop(row.id)"
        >
          <glz-icon [icon]="icons.stop" />
        </button>
      </div>
      @if (row.refusal; as refusal) {
        <p class="error" role="alert" data-testid="command-refusal">{{ refusal }}</p>
      }
    </li>
  }
</ul>
