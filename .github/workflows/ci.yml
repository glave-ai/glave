name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run still going; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Incremental data is never reused across runs, so writing it only costs time. Build caches
# (the registry and dependencies, not workspace crates) are saved from main only, and pull
# requests restore them: per-PR copies pushed the repository past its 10 GB cache limit.
env:
  CARGO_INCREMENTAL: "0"
  # The web checks run in the `web` job; `cargo xtask ci` in the Rust jobs skips them.
  GLAVE_SKIP_WEB: "1"

# Every job has a timeout of about three times its longest run (October 2026), so a hang fails
# in minutes rather than holding the merge queue for GitHub's six hours.
jobs:
  # `cargo xtask ci --all` on Linux twice, side by side: on the runner's glibc, and built for
  # musl, as glave's Linux releases are (dist-workspace.toml), so every glave the tests start
  # runs on the release's allocator too (crates/cli/src/allocator.rs). musl's standard library
  # differs from glibc's in ways only its own run shows: #696 found a hang there that glibc
  # never had. `linux`, below them, passes only when both did; it is the check the `main`
  # ruleset requires.
  linux-checks:
    name: linux-checks (${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            runner: ubuntu-latest
            worker-glave: target/debug/glave
          # On the runner the release builds x86-64 Linux on (dist's plan), so with its C
          # compiler and musl, as budgets.yml builds it too.
          - libc: musl
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            worker-glave: target/x86_64-unknown-linux-musl/debug/glave
    # A real Postgres, so the Postgres store runs its conformance suites here instead of
    # skipping them.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: glave
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    # The runner's own Docker, so the Docker worker backend runs its tests here too (a small
    # alpine image pinned by digest, a stub in glave's place). Everything they make is
    # labelled glave.test=<run id>, which this job sweeps, and glave.test.case=<id> per test,
    # which each test checks so it never sees the containers of a test running beside it.
    env:
      # glave signs in as a role of its own, which row-level security binds, as the store
      # requires; the tests look at every organization's rows as the superuser.
      GLAVE_TEST_POSTGRES_URL: postgres://glave:glave@localhost:5432/glave
      GLAVE_TEST_POSTGRES_ADMIN_URL: postgres://postgres:glave@localhost:5432/glave
      # The S3-compatible bucket a step below starts, so the bucket's suites run here too.
      GLAVE_TEST_S3_URL: s3://glave-test
      GLAVE_TEST_S3_ENDPOINT: http://localhost:8333
      GLAVE_TEST_DOCKER: "1"
      # A real worker too: the glave this job builds (Linux, the runner's processor), in a
      # pinned image with bash and git whose glibc is Ubuntu 24.04's, as the glibc build's
      # runner is; the musl build is static, and runs in any image.
      GLAVE_TEST_WORKER_GLAVE: ${{ github.workspace }}/${{ matrix.worker-glave }}
      GLAVE_TEST_WORKER_IMAGE: buildpack-deps:noble-scm@sha256:4163ac2c58660c533f3cf3d178551287ddd0ac18269ef84f3a382d0698c89254
      # The flags dist sets for a musl target (today's defaults, which dist keeps in case they
      # change), as the target's own, which only what is built for musl reads: never the
      # programs the tests build for the runner (the eval graders' `cargo build`).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -Ctarget-feature=+crt-static -Clink-self-contained=yes
    steps:
      - name: A database role of glave's own, owning its database
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres
          -c "CREATE ROLE glave LOGIN PASSWORD 'glave' NOSUPERUSER NOBYPASSRLS"
          -c "CREATE DATABASE glave OWNER glave"
      # Linking every test binary of the workspace once filled a smaller runner's disk (ld died
      # with a bus error). Today's runner starts with about 85 GB free and the build takes about
      # 8, so the toolchains it ships that glave never uses (about 30 GB, and minutes to remove)
      # go only when less than 40 GB is free, five times what the build needs.
      - name: Free disk space, if the runner is short of it
        run: |
          df -h /
          free="$(df -BG --output=avail / | awk 'NR == 2 { print int($1) }')"
          if [ "$free" -ge 40 ]; then
            echo "$free GB free, enough: nothing removed"
            exit 0
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@v7
      # Every shell script the repository tracks: each `.sh`, and each file whose first line runs
      # sh, bash, dash or ksh. Not the files an eval task starts from (evals/tasks/*/environment),
      # which the model is given as they are, flaws and all. Once, as the scripts are the same.
      - name: Shellcheck every shell script
        if: matrix.libc == 'glibc'
        run: |
          git ls-files -z | xargs -0 awk 'FNR == 1 { if ((FILENAME ~ /\.sh$/ || $0 ~ /^#!.*[\/ ](ba|da|k)?sh( |$)/) && FILENAME !~ /^evals\/tasks\/[^\/]+\/environment\//) print FILENAME; nextfile }' >"$RUNNER_TEMP/scripts"
          echo "$(wc -l <"$RUNNER_TEMP/scripts") shell scripts"
          xargs -d '\n' shellcheck <"$RUNNER_TEMP/scripts"
      # SeaweedFS (Apache-2.0) as an S3-compatible bucket, pinned by digest. A service container
      # cannot be given its command (`server -s3`), so a step starts it, and makes the tests'
      # bucket once it answers. It keeps no keys, so the tests send their requests unsigned.
      - name: Start an S3-compatible bucket
        run: |
          image=chrislusf/seaweedfs@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
          .github/pull-image.sh "$image"
          docker run -d --name seaweedfs -p 8333:8333 "$image" server -s3
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null -X PUT http://localhost:8333/glave-test; then exit 0; fi
            sleep 1
          done
          docker logs seaweedfs
          exit 1
      # Pebble (MPL-2.0), Let's Encrypt's ACME test server, pinned by digest, so glave gets a
      # real certificate here: it checks glave.test, this runner, over TLS-ALPN-01 on port 5001.
      # Its directory is served under a root of its own, which the test hands to glave alone.
      - name: Start an ACME test server
        run: |
          image=ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
          .github/pull-image.sh "$image"
          docker run -d --name pebble -p 14000:14000 -p 15000:15000 \
            --add-host glave.test:host-gateway -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            "$image"
          docker cp pebble:/test/certs/pebble.minica.pem "$RUNNER_TEMP/pebble.minica.pem"
          {
            echo "GLAVE_TEST_ACME_DIRECTORY=https://localhost:14000/dir"
            echo "GLAVE_TEST_ACME_ROOT=$RUNNER_TEMP/pebble.minica.pem"
            echo "GLAVE_TEST_ACME_ROOTS=https://localhost:15000/roots/0"
            echo "GLAVE_TEST_ACME_PORT=5001"
          } >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -sf --cacert "$RUNNER_TEMP/pebble.minica.pem" -o /dev/null https://localhost:14000/dir; then exit 0; fi
            sleep 1
          done
          docker logs pebble
          exit 1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # As the release build installs them: musl's standard library for the pinned toolchain,
      # and musl's compiler wrapper for the C in glave's dependencies.
      - name: Install musl's standard library and musl-gcc
        if: matrix.libc == 'musl'
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
      # Saved from main only; each build's cache under a key of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.libc }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      # On musl the lint, docs and tests are built with `--target`, which the commands the tests
      # run never see, so those (the eval graders' `cargo build`) build for the runner.
      - name: cargo xtask ci --all, on ${{ matrix.libc }}
        run: cargo xtask ci --all ${{ matrix.target && format('--target {0}', matrix.target) }}
      - name: Disk space after the build
        if: always()
        run: df -h /
      - name: Nothing the Docker tests made is left behind
        if: always()
        run: |
          label="label=glave.test=${{ github.run_id }}"
          left="$(docker ps -aq --filter "$label")$(docker ps -aq --filter label=glave.worker)$(docker volume ls -q --filter "$label")$(docker network ls -q --filter "$label")"
          # The worker image is shared by two tests running at once, so it is removed here.
          docker image rm "$GLAVE_TEST_WORKER_IMAGE" >/dev/null 2>&1 || true
          if docker image inspect "$GLAVE_TEST_WORKER_IMAGE" >/dev/null 2>&1; then
            echo "the worker image is left behind"
            exit 1
          fi
          if [ -n "$left" ]; then
            echo "left behind: $left"
            exit 1
          fi
          if docker image inspect "alpine@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507" >/dev/null 2>&1; then
            echo "the test image is left behind"
            exit 1
          fi

  linux:
    if: always()
    needs: linux-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The checks passed on glibc and on musl
        env:
          CHECKS: ${{ needs.linux-checks.result }}
        run: |
          echo "checks: $CHECKS"
          test "$CHECKS" = success

  # web/: the session API's TypeScript client, Glaze and the app, in jobs side by side: the
  # checks, and the end-to-end tests in four shards. `web`, below them, passes only when every
  # one did; it is the check the `main` ruleset requires.
  #
  # The checks: format, lint (eslint and stylelint), type-check, unused files and dependencies
  # (knip), the licences and audit of what ships, the app's messages against its source and
  # every language, unit tests with axe, the library, app and showcase builds, every release
  # archive's third-party notices, and glave built with the app inside (the `web` feature) and
  # its serving tests.
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
        working-directory: .
      # One build cache for the web jobs: this job saves it (from main), the shards restore it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cargo-about at the version .github/third-party-notices.sh names, as a release binary, so
      # the script needn't build it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-about@0.9.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run licenses
      - run: npm run audit
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build:glaze
      - run: npm run build
      # Written by the script the release writes them with, for every target it builds at once:
      # a crate whose licence cargo-about can't find or about.toml doesn't accept, or an npm
      # package that ships no licence text, fails here rather than in a release.
      - name: Every release archive's third-party notices
        run: sh .github/third-party-notices.sh
        working-directory: .
      - run: npm run build:showcase
      - name: Build glave with the app inside, and test that it serves it
        run: cargo nextest run -p glave --features web --test cli -E 'test(/^serve::/)'
        working-directory: .

  # End-to-end tests in Chromium and WebKit with axe in light and dark, against the real
  # `glave serve --http --web` and its Content Security Policy: each browser's tests split in
  # two shards, each on a runner of its own, with the app, the showcase and glave built there.
  # The tests run in Playwright's own image, which carries the browsers and every system
  # package they need, so no run installs them (installing them with `--with-deps` took
  # minutes, and once 35). The builds stay on the runner, with its toolchain and caches, and
  # what they make runs in the image: Ubuntu 24.04, as the runner is.
  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    env:
      GLAVE_BIN: ${{ github.workspace }}/target/debug/glave
      # At the Playwright version web/ uses (package-lock.json), pinned by digest. When web/
      # moves to another, the tests fail at once and name the image they need.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
        working-directory: .
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web
          save-if: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:showcase
      # Built as the checks build it for its serving tests, so the cache they save serves it,
      # and the MCP test server beside it, which the tests sign in to. Playwright's image is
      # pulled meanwhile, which takes about as long.
      - name: Build glave with the app inside, and pull Playwright's image
        run: |
          .github/pull-image.sh "$PLAYWRIGHT_IMAGE" &
          cargo test -p glave --features web --test cli --no-run
          cargo build -p glave-mcp --features test-server --bin=glave-mcp-test-server
          wait $!
        working-directory: .
      # The scripts look for the browsers in node_modules (PLAYWRIGHT_BROWSERS_PATH=0), and the
      # image keeps them in /ms-playwright: a link to there, which resolves in the image.
      - name: The image's browsers, where the scripts look for them
        run: ln -s /ms-playwright node_modules/playwright-core/.local-browsers
      # In the image, the workspace is at its path on the runner, so GLAVE_BIN and every other
      # path are the same there. As Playwright's docs run it: with an init process, which reaps
      # what a killed runner leaves, and the runner's shared memory, which Chromium needs.
      # Chromium's job also runs how the app feels (the `feel` project), alone once Chromium's
      # other tests are done.
      - name: npm run e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
        run: >-
          docker run --rm --init --ipc=host -e CI -e GLAVE_BIN
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" "$PLAYWRIGHT_IMAGE"
          npm run e2e -- --project=${{ matrix.browser }}
          ${{ matrix.browser == 'chromium' && '--project=feel' || '' }} --shard=${{ matrix.shard }}/2
      # A runner killed outright leaves nothing it started (#558): once, on one shard.
      - name: npm run e2e:killed
        if: matrix.browser == 'chromium' && matrix.shard == 1
        run: >-
          docker run --rm --init --ipc=host -e CI -e GLAVE_BIN
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" "$PLAYWRIGHT_IMAGE"
          npm run e2e:killed
      # A failed run keeps what Playwright kept (a trace of each failed test), so a flake is
      # found from what happened rather than rerun until it passes.
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.browser }}-${{ matrix.shard }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 14

  web:
    if: always()
    needs: [web-checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The checks and every end-to-end shard passed
        env:
          CHECKS: ${{ needs.web-checks.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "checks: $CHECKS, end-to-end: $E2E"
          test "$CHECKS" = success
          test "$E2E" = success

  # The release workflow is dist's with two changes (`cargo xtask release-workflow`): every job's
  # token read-only but the publishing job's, and the install script made to check every
  # archive. dist doesn't check a workflow its config says is edited by hand, so this job does:
  # what the xtask writes from today's config is what's checked in, and the change to the
  # install script still applies to the one dist writes today.
  release-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install dist, the version dist-workspace.toml names
        shell: bash
        run: |
          version="$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh
      - run: cargo xtask release-workflow
      - name: release.yml is what the xtask writes
        run: git diff --exit-code
      # With no archives built, the script dist writes carries no checksums, but its check is
      # the same.
      - name: The install script dist writes takes the change that makes it check every archive
        run: |
          dist build --artifacts=global --output-format=json >/dev/null
          sh .github/install-script-checksums.sh target/distrib/glave-installer.sh

  # Workers on Kubernetes: a kind cluster on the runner, and the Kubernetes backend's tests
  # against it (a stub in glave's place, then the glave this job builds in real workers, with a
  # network and without, reached through bridges exec'd in their Pods, and a person's computer
  # that sleeps and wakes on its disk, on glave's own image, images/computer, built here). Everything they make is labelled
  # glave.test=<run id>, and nothing labelled may be left.
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GLAVE_TEST_KUBE: "1"
      GLAVE_TEST_KUBE_RUNTIME_CLASS: glave-test-runc
      GLAVE_TEST_WORKER_GLAVE: ${{ github.workspace }}/target/debug/glave
      GLAVE_TEST_WORKER_IMAGE: buildpack-deps:noble-scm@sha256:4163ac2c58660c533f3cf3d178551287ddd0ac18269ef84f3a382d0698c89254
    steps:
      # Linking every test binary of the workspace once filled a smaller runner's disk (ld died
      # with a bus error). Today's runner starts with about 85 GB free and the build takes about
      # 8, so the toolchains it ships that glave never uses (about 30 GB, and minutes to remove)
      # go only when less than 40 GB is free, five times what the build needs.
      - name: Free disk space, if the runner is short of it
        run: |
          df -h /
          free="$(df -BG --output=avail / | awk 'NR == 2 { print int($1) }')"
          if [ "$free" -ge 40 ]; then
            echo "$free GB free, enough: nothing removed"
            exit 0
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
          cluster_name: glave
          # A registry on the runner the cluster pulls from, so glave's computer image is used
          # by its digest, as a deployment pins it.
          registry: true
      - name: glave's computer image, built and pushed to the cluster's registry
        run: |
          docker build -t kind-registry:5000/glave-computer:test images/computer
          docker push -q kind-registry:5000/glave-computer:test
          image="$(docker inspect --format '{{index .RepoDigests 0}}' kind-registry:5000/glave-computer:test)"
          docker image ls kind-registry:5000/glave-computer --format 'glave-computer: {{.Size}}'
          echo "GLAVE_TEST_COMPUTER_IMAGE=$image" >> "$GITHUB_ENV"
      # gVisor in the kind node, as GKE Sandbox runs every person's computer: runsc and its
      # containerd shim from gVisor's release, pinned by its SHA-512, and a runtime class for it.
      - name: gVisor in the kind node
        env:
          GVISOR_RELEASE: "20261019"
          GVISOR_SHA512: bcbf431b2f9a039f6ab23bfe23986031130c0f149294978cedfd46910901deba0737d8642c848f597ed4b5c72324885db4d75ee86a1f6a90915fbe1f2f2eb915
        run: |
          mkdir -p "$RUNNER_TEMP/gvisor" && cd "$RUNNER_TEMP/gvisor"
          curl -fsSL -o gvisor.tar.zstd "https://storage.googleapis.com/gvisor/releases/release/$GVISOR_RELEASE/x86_64/gvisor.tar.zstd"
          echo "$GVISOR_SHA512  gvisor.tar.zstd" | sha512sum -c -
          mkdir -p unpacked && tar --zstd -xf gvisor.tar.zstd -C unpacked
          # runsc, the sidecars it starts beside it (gvisor-bin/), and the shim.
          runsc="$(find unpacked -type f -name runsc | head -n 1)"
          docker cp "$runsc" glave-control-plane:/usr/local/bin/runsc
          docker cp "$(dirname "$runsc")/gvisor-bin" glave-control-plane:/usr/local/bin/gvisor-bin
          docker cp "$(find unpacked -type f -name containerd-shim-runsc-v1 | head -n 1)" glave-control-plane:/usr/local/bin/
          docker exec glave-control-plane sh -c 'chmod 0755 /usr/local/bin/runsc /usr/local/bin/containerd-shim-runsc-v1 && chmod -R a+rX /usr/local/bin/gvisor-bin'
          # The shim runs runsc with systemd's cgroups, as kind's containerd runs runc, under
          # the plugin name the node's containerd config version uses.
          docker exec glave-control-plane sh -c 'printf "[runsc_config]\n  systemd-cgroup = \"true\"\n" > /etc/containerd/runsc.toml'
          if docker exec glave-control-plane grep -q '^version = 3' /etc/containerd/config.toml; then
            plugin='io.containerd.cri.v1.runtime'
          else
            plugin='io.containerd.grpc.v1.cri'
          fi
          docker exec glave-control-plane sh -c "printf '\n[plugins.\"$plugin\".containerd.runtimes.runsc]\n  runtime_type = \"io.containerd.runsc.v1\"\n[plugins.\"$plugin\".containerd.runtimes.runsc.options]\n  TypeUrl = \"io.containerd.runsc.v1.options\"\n  ConfigPath = \"/etc/containerd/runsc.toml\"\n' >> /etc/containerd/config.toml && systemctl restart containerd"
          kubectl wait --for=condition=Ready node --all --timeout=120s
          kubectl apply -f - <<'EOF'
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: glave-test-gvisor
          handler: runsc
          EOF
          # A Pod under it that says what kernel it sees, before any test relies on it.
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: gvisor-smoke
            labels:
              glave.test: "${{ github.run_id }}"
          spec:
            runtimeClassName: glave-test-gvisor
            restartPolicy: Never
            containers:
              - name: smoke
                image: alpine@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
                command: ["dmesg"]
          EOF
          if ! kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/gvisor-smoke --timeout=120s; then
            kubectl describe pod gvisor-smoke
            docker exec glave-control-plane journalctl -u containerd --no-pager | tail -n 60
            exit 1
          fi
          kubectl logs gvisor-smoke
          kubectl delete pod gvisor-smoke --wait=true
      # A runtime class on kind's own runc, so the real workers run under one: the class is set
      # on the Pod and the VM-isolation policy accepts it.
      - name: A runtime class for the real workers
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: glave-test-runc
          handler: runc
          EOF
      - run: cargo build -p glave
      # What passing tests print is shown too: how long a person's computer took to wake.
      - run: cargo nextest run -p glave-computer --all-features --success-output final -E 'test(/^worker::kubernetes::/)'
      # A person's computer under gVisor, as GKE Sandbox runs it: its disk, walls and tools,
      # then measured under runc and under gVisor (the wake, whether glave's sandbox starts,
      # a build); the numbers are printed.
      - name: A person's computer under gVisor, and measured under each runtime
        env:
          GLAVE_TEST_MEASURE: "1"
        run: |
          GLAVE_TEST_KUBE_RUNTIME_CLASS=glave-test-gvisor cargo nextest run -p glave-computer --all-features --success-output final -E 'test(/keeps_its_disk_while_it_sleeps/)'
          # glave's own sandbox inside it, every wall and what it costs.
          GLAVE_TEST_KUBE_RUNTIME_CLASS=glave-test-gvisor cargo nextest run -p glave-computer --all-features --success-output final -E 'test(/sandbox_holds_on_a_persons_computer/)'
          # Each measurement alone on the node.
          GLAVE_TEST_KUBE_RUNTIME_CLASS=glave-test-gvisor cargo nextest run -p glave-computer --all-features --success-output final -E 'test(/measured_under_its_runtime/)'
          cargo nextest run -p glave-computer --all-features --success-output final -E 'test(/measured_under_its_runtime/)'
      - name: Disk space after the build
        if: always()
        run: df -h /
      - name: What the cluster says, when a test failed
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods -l glave.computer | tail -n 80
          docker exec glave-control-plane journalctl -u containerd --no-pager | grep -i runsc | tail -n 40
      - name: Nothing the Kubernetes tests made is left behind
        if: always()
        run: |
          left="$(kubectl get pods,networkpolicies,persistentvolumeclaims,secrets -A -l "glave.test=${{ github.run_id }}" -o name)$(kubectl get pods -A -l glave.worker -o name)$(kubectl get pods,persistentvolumeclaims -A -l glave.computer -o name)"
          if [ -n "$left" ]; then
            echo "left behind: $left"
            exit 1
          fi

  # The sandbox on Linux, for real: first Landlock, the fallback, with bubblewrap absent (glave
  # itself is the helper), then bubblewrap and seccomp, with every sandbox test required to
  # run rather than skip.
  sandbox-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Linking every test binary of the workspace once filled a smaller runner's disk (ld died
      # with a bus error). Today's runner starts with about 85 GB free and the build takes about
      # 8, so the toolchains it ships that glave never uses (about 30 GB, and minutes to remove)
      # go only when less than 40 GB is free, five times what the build needs.
      - name: Free disk space, if the runner is short of it
        run: |
          df -h /
          free="$(df -BG --output=avail / | awk 'NR == 2 { print int($1) }')"
          if [ "$free" -ge 40 ]; then
            echo "$free GB free, enough: nothing removed"
            exit 0
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo build -p glave
      # The MCP server the binary's tests start, killed with glave in orphans.rs.
      - run: cargo build -p glave-mcp --features test-server
      - name: Landlock, without bubblewrap
        env:
          GLAVE_REQUIRE_LANDLOCK: "1"
          GLAVE_TEST_SANDBOX_HELPER: ${{ github.workspace }}/target/debug/glave
        run: |
          sudo apt-get remove -y bubblewrap >/dev/null 2>&1 || true
          if command -v bwrap; then echo "bubblewrap is still installed"; exit 1; fi
          cargo nextest run -p glave-computer -E 'test(/landlock/)'
          cargo nextest run -p glave --test cli -E 'test(/landlock/)'
      # Again with the helper as releases build it, on musl, whose standard library opens files
      # differently from glibc's: there it once waited forever on a named pipe in /tmp.
      - name: Landlock, without bubblewrap, with the helper built for musl
        env:
          GLAVE_REQUIRE_LANDLOCK: "1"
          GLAVE_TEST_SANDBOX_HELPER: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/debug/glave
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build -p glave --target x86_64-unknown-linux-musl
          cargo nextest run -p glave-computer -E 'test(/landlock/)'
      # Ubuntu 23.10 and later let only programs AppArmor allows create user namespaces; this
      # is the profile the person adds too (specs/sandbox.md).
      - name: Install bubblewrap, with an AppArmor profile that lets it make user namespaces
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if [ -d /etc/apparmor.d ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n  include if exists <local/bwrap>\n}\n' | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --version
      # The judge's tests and the modes' too: the judge decides only in Auto behind the
      # sandbox's wall, and Ask first is its read-only sandbox.
      - name: bubblewrap and seccomp
        env:
          GLAVE_REQUIRE_SANDBOX: "1"
        run: cargo nextest run -p glave-computer -p glave-harness -p glave-memory -p glave -E 'test(/sandbox|judge|modes::/)'
      - name: Disk space after the build
        if: always()
        run: df -h /

  # macOS runs once per change, in the merge queue, then on main (and on demand). Pull
  # requests skip it, and a skipped job counts as passing.
  #
  # GitHub sometimes finds no macOS runner for a job and cancels it after about 15 minutes, with
  # no step run (#952). `macos-run` then gets one more try, `macos-retry`, in the same run; a job
  # a runner took never does, so a test that fails or hangs fails the check. `macos`, below them,
  # passes when either passed; it is the check the `main` ruleset requires.
  macos-run:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      started: ${{ steps.started.outputs.started }}
    env: &macos-env
      GLAVE_REQUIRE_SANDBOX: "1"
    steps: &macos-steps
      # What tells the retry a runner took this job: a job none took has no outputs.
      - name: A runner took the job
        id: started
        run: echo started=true >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      # macOS's /bin/sh is bash 3.2, which reads some scripts otherwise than dash and shellcheck
      # do: a heredoc inside $(…) whose text holds a `)` ends early there, and what follows runs
      # as commands. The scripts in .github run on macOS in a release, or by a maintainer's hand.
      - name: The scripts in .github parse under macOS's /bin/sh
        run: for script in .github/*.sh; do /bin/sh -n "$script"; done
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      - run: cargo xtask ci --all

  # Only when no runner took the first try; not when the whole run was cancelled.
  macos-retry:
    needs: macos-run
    if: "!cancelled() && needs.macos-run.result == 'cancelled' && needs.macos-run.outputs.started != 'true'"
    runs-on: macos-latest
    timeout-minutes: 45
    env: *macos-env
    steps: *macos-steps

  macos:
    if: always() && github.event_name != 'pull_request'
    needs: [macos-run, macos-retry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The checks passed on macOS, at the first try or the retry
        env:
          RUN: ${{ needs.macos-run.result }}
          RETRY: ${{ needs.macos-retry.result }}
        run: |
          echo "first try: $RUN, retry: $RETRY"
          test "$RUN" = success || test "$RETRY" = success
