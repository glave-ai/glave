[package]
name = "glave-memory"
description = "glave's memory: an MCP server over the data store, each memory sealed under its own key, scoped by the session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one program, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "memory"
path = "tests/main.rs"

[dependencies]
glave-event.workspace = true
# glave's MCP client, connected in-process to the memory server.
glave-mcp.workspace = true
glave-ports.workspace = true
jiff.workspace = true
# The memory server speaks MCP, through the official SDK the client already uses.
rmcp = { workspace = true, features = ["server", "client", "transport-async-rw"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync"] }

[dev-dependencies]
glave-computer.workspace = true
# The tests run memory in the harness, as glave does.
glave-harness.workspace = true
# The tests seal memories under real keys, as the store does.
glave-keys.workspace = true
glave-ports = { workspace = true, features = ["conformance"] }
glave-store-sqlite.workspace = true
proptest.workspace = true
uuid.workspace = true

[lints]
workspace = true
