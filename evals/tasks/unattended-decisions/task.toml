[task]
name = "glave/unattended-decisions"
description = "One job through several compactions with no one answering: decisions in early tickets bind later ones that don't repeat them, and finished tickets are neither lost nor closed twice."

[agent]
timeout_sec = 1500

[glave]
tier = "hard"
permissions = "auto"
# Small enough that a few files fill it, so the job compacts several times.
context_window = 12000
max_steps = 80
# A long-running goal's own limit; `--no-goal` runs the same instruction as one turn.
goal = { budget = 500000 }
setup = ["chmod +x tools/close", "python3 {task}/../../unattended/pad.py"]
checks = ["one_thread"]
