<textarea
  #textarea
  class="input"
  rows="1"
  [attr.data-testid]="ids().input"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="hintId"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [value]="value()"
  (input)="typed($event)"
  (keydown)="keydown($event)"
></textarea>
<p class="glz-visually-hidden" [id]="hintId">{{ hint() }}</p>
<div class="bar">
  <div class="start">
    <ng-content select="[glzComposerStart]" />
  </div>
  <div class="end">
    <ng-content select="[glzComposerEnd]" />
    @if (busy()) {
      <button
        glzIconButton
        variant="secondary"
        [attr.data-testid]="ids().stop"
        [label]="stopLabel()"
        (click)="stopped()"
      >
        <glz-icon [icon]="stopIcon" />
      </button>
    } @else {
      <button
        glzIconButton
        class="send"
        variant="primary"
        [attr.data-testid]="ids().send"
        [label]="sendLabel()"
        [disabled]="sendDisabled()"
        (click)="submit()"
      >
        <glz-icon [icon]="sendIcon" />
      </button>
    }
  </div>
</div>
