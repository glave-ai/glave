# The connectors glave offers (`specs/session.md`, "Connectors"): official remote MCP servers,
# each hosted by the vendor whose service it reaches and confirmed on that vendor's own docs
# page (`docs`). Built into glave and versioned with it, never fetched. Each works with any
# client today: `sign_in` is `dcr` (the person signs in, glave registering as a client) or
# `none`. A connector's `id` is stable: it names the connector to `[mcp] catalog`, to its tools
# (`mcp__<id>__<tool>`) and to the accounts ledger. A company's `id` is stable too. `name` is
# the vendor's, never translated; `description` is a Fluent message in English (`connector-<id>`).
# `categories` and `tags` are the ids of `protocol/connectors.rs`, which holds their messages;
# the first category is the connector's home, where a client that shows it once puts it.
# `returns` is `files` when the vendor's docs show a tool that hands back a file or media,
# `text` when they list the tools and none does, and `unknown` when they don't say.

