[package]
name = "glave-mcp"
description = "glave's MCP client: tools from Model Context Protocol servers as a tool source, through the official rmcp SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one program, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "mcp"
path = "tests/main.rs"
required-features = ["test-server"]

[[bin]]
name = "glave-mcp-test-server"
path = "src/bin/test_server.rs"
required-features = ["test-server"]

[dependencies]
glave-event.workspace = true
glave-ports.workspace = true
# A stdio server's process: owned, in a group of its own, recorded while it runs.
glave-process.workspace = true
# Header types for rmcp's HTTP transport, which does not re-export them.
http.workspace = true
rmcp = { workspace = true, features = [
    # Signing in to remote servers as MCP's authorization says (`signin.rs`).
    "auth",
    "client",
    "reqwest",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
] }
# Named only to find why an HTTP server could not be reached; rmcp already uses it.
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# A project's folder as the `file://` root a server is told of; reqwest already uses it.
url.workspace = true
# Only for the test server: its HTTP, and what it answers when it asks for a sign-in.
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["http1", "server"] }
hyper-util = { workspace = true, optional = true, features = ["service", "tokio"] }

[features]
# A small MCP server on stdio, for tests in this and other crates; over HTTP, it can ask for a
# sign-in at a fake authorization server of its own (glave-ports' test doubles).
test-server = [
    "glave-ports/conformance",
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "rmcp/server",
    "rmcp/transport-io",
    "rmcp/transport-streamable-http-server",
    "tokio/io-std",
    "tokio/macros",
    "tokio/net",
]

[dev-dependencies]
glave-ports = { workspace = true, features = ["conformance"] }
# Servers written by hand on a pipe, on a paused clock (`tests/probe.rs`, `tests/limits.rs`).
tokio = { workspace = true, features = ["io-util", "test-util"] }

[lints]
workspace = true
