[package]
name = "glave-ports"
description = "glave's ports: the event log, blob store, model provider, tool source and computer interfaces, with in-memory implementations and conformance suites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Exposes the conformance suites so adapter crates can run them in their own tests, and the
# test doubles every crate's tests share (`testing`).
conformance = ["dep:tokio"]

[dependencies]
# The operating system's randomness, for the random part of new ids.
getrandom.workspace = true
glave-event.workspace = true
# The clock's time.
jiff.workspace = true
# Hook matchers are regular expressions over tool names, as Claude Code and Codex write them.
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The runtime tests run on, the gate a scripted model waits at (`testing`), and the paused
# clock the model provider suite waits out a silence on.
tokio = { workspace = true, features = ["rt", "sync", "time", "test-util"], optional = true }
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "test-util"] }

[lints]
workspace = true
