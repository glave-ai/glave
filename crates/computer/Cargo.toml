[package]
name = "glave-computer"
description = "glave's computers: this machine as a computer, environments read from environment.toml or devcontainer.json, and computers served and reached over JSON-RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The random part of new computer and workspace ids (UUID v7).
getrandom.workspace = true
glave-ports.workspace = true
# File patterns as models write them, for files/glob and files/search.
globset.workspace = true
# Walking a workspace the way git sees it, leaving out what it ignores.
ignore.workspace = true
# The expressions files/search looks for.
regex.workspace = true
# Resolving every path one name at a time from an open handle on the workspace root
# (openat, no-follow), so a link swapped in by a command cannot lead a file tool outside.
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
# Reading .glave/environment.toml.
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
glave-ports = { workspace = true, features = ["conformance"] }
proptest.workspace = true

[lints]
workspace = true
