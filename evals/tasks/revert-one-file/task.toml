[task]
name = "glave/revert-one-file"
description = "Undoes one file's part of the last commit, keeps the rest, and commits."

[agent]
timeout_sec = 600

[glave]
tier = "hard"
# Real work runs commands: nothing asks but secrets.
permissions = "workspace"
# Commits need an author, and this computer may not have one set.
env = { GIT_AUTHOR_NAME = "Eval", GIT_AUTHOR_EMAIL = "eval@example.com", GIT_COMMITTER_NAME = "Eval", GIT_COMMITTER_EMAIL = "eval@example.com" }
setup = ["bash '{task}/setup.sh'"]
