[package]
name = "glave-store-postgres"
description = "glave's Postgres storage: the event log and blob store for an organization's one data store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
deadpool-postgres.workspace = true
glave-event.workspace = true
glave-keys.workspace = true
glave-ports.workspace = true
jiff.workspace = true
serde_json.workspace = true
# TLS to a database on another computer: rustls on aws-lc-rs, as the rest of glave, and the
# operating system's certificate verifier (both already in the tree, under reqwest).
rustls.workspace = true
rustls-platform-verifier.workspace = true
thiserror.workspace = true
tokio-postgres.workspace = true
# rustls for tokio-postgres: the driver's own TLS hook, maintained beside it.
tokio-postgres-rustls.workspace = true
# A content-free span for each append.
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Browser sessions kept on this store, by two servers at once.
glave-identity.workspace = true
glave-keys = { workspace = true, features = ["conformance"] }
glave-ports = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
