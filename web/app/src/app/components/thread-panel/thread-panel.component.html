<div class="header">
  <h2
    #heading
    class="heading"
    tabindex="-1"
    data-testid="panel-heading"
    [class.glz-visually-hidden]="beside()"
  >
    {{ copy.heading }}
  </h2>
  <button
    glzIconButton
    class="close"
    data-testid="panel-close"
    [label]="copy.close"
    (click)="close()"
  >
    <glz-icon [icon]="icons.close" />
  </button>
</div>
<glz-tabs
  class="tabs"
  testId="panel-tabs"
  [label]="copy.tabs"
  [selected]="selected()"
  (selectedChange)="choose($event)"
>
  @for (tab of tabs(); track tab.key) {
    <glz-tab [label]="tab.label">
      @switch (tab.key) {
        @case ('overview') {
          <app-thread-overview />
        }
        @case ('terminal') {
          <app-terminal-tab />
        }
        @case ('changes') {
          <app-thread-files [files]="facts.files()" [note]="facts.note()" />
        }
      }
    </glz-tab>
  }
</glz-tabs>
