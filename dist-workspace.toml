[workspace]
members = ["cargo:."]

# Releases, with dist (https://axodotdev.github.io/cargo-dist/), run by hand: the Release
# workflow, run from GitHub's Actions tab with the tag of the version Cargo.toml names (`v0.1.0`
# for 0.1.0), builds glave for each target, with the web app inside, tries the installers on
# what it built, then publishes the archives, their checksums, GitHub's build provenance, an
# install script and a Homebrew formula, and makes the tag on the commit it ran on. Run with its
# default, `dry-run`, it does all of that but publish. The workflow,
# .github/workflows/release.yml, is generated from this file: after changing it, run
# `cargo xtask release-workflow`, with dist installed at the version below.
[dist]
cargo-dist-version = "0.33.0"
# dist has no setting for two things the release needs, so `cargo xtask release-workflow` runs
# `dist generate` and changes what it writes. The token is read-only for every job but the one
# that publishes, whereas dist gives every job one that can change releases and tags. And the
# install script checks every archive, with shasum when sha256sum is missing, whereas dist's
# then installs it unchecked (.github/install-script-checksums.sh). This line keeps dist from
# failing on those changes; CI checks that release.yml is still what the xtask writes.
allow-dirty = ["ci"]
ci = "github"
hosting = "github"
# Only what ships is built (the glave command, crates/cli/Cargo.toml), not the whole workspace.
precise-builds = true
# Linux builds are static (musl), so one binary runs on any distribution and in any container.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
github-build-setup = "../build-setup.yml"
# Beside the README and LICENSE in each archive: the binary carries code under its notices, and
# the licences of the Rust crates and npm packages built into it, which the build writes
# (.github/build-setup.yml).
include = ["NOTICE", "THIRD-PARTY-NOTICES"]
installers = ["shell", "homebrew"]
# Where the install script puts glave, as uv's and Claude Code's do; it adds the folder to PATH
# when it isn't there already.
install-path = "~/.local/bin"
# No separate updater program: dist's is a prebuilt binary that glave's builds don't make.
install-updater = false
tap = "glave-ai/homebrew-tap"
# Once the release is out: the Homebrew formula, and glave's computer image on GitHub's container
# registry (.github/workflows/publish-computer-image.yml), the one job of the run besides the
# release's own that may write, and only packages and attestations.
publish-jobs = ["homebrew", "./publish-computer-image"]
# Provenance for what is released, made when it is: pull requests' builds are not attested.
github-attestations = true
github-attestations-phase = "host"
github-release = "host"
# Run by hand, with the tag to release or `dry-run` (above), rather than by pushing a tag, so
# that the same workflow makes a dry run, on any branch.
dispatch-releases = true
# The installers, tried on what the run built before anything is published, and in a dry run
# (.github/workflows/release-installers.yml): the release waits for them.
global-artifacts-jobs = ["./release-installers"]
# Pull requests check the plan, not the builds: building every target takes about 25 minutes,
# two of them on macOS, which ci.yml keeps off pull requests. A dry run (above) builds every
# target, as a release would.
pr-run-mode = "plan"

# Actions in dist's workflow whose dist default lags the major the other workflows use, each
# written after the `@` as given. Bumped here by hand (.github/dependabot.yml says why); an
# entry goes once a dist upgrade's own default reaches it.
[dist.github-action-commits]
"actions/checkout" = "v7"
