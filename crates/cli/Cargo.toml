[package]
name = "glave"
description = "The glave command: run hope, or any model, on your project from the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "glave"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
getrandom.workspace = true
glave-event.workspace = true
glave-harness.workspace = true
glave-ports.workspace = true
glave-provider-openai.workspace = true
glave-session.workspace = true
glave-store-sqlite.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "signal", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
glave-provider-openai = { workspace = true, features = ["fake-server"] }
serde_json.workspace = true

[[bench]]
name = "budgets"
harness = false

[lints]
workspace = true
