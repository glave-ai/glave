name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    # A real Postgres, so the Postgres store runs its conformance suites here instead of
    # skipping them.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: glave
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      GLAVE_TEST_POSTGRES_URL: postgres://postgres:glave@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo xtask ci

  # macOS minutes cost 10x on private repos, so this runs on main only (and on demand).
  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      GLAVE_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo xtask ci
