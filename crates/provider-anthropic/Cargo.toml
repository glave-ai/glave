[package]
name = "glave-provider-anthropic"
description = "glave's model provider for Anthropic's native Messages API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glave-event.workspace = true
glave-ports.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# A fake Messages API server on 127.0.0.1, for tests in this and other crates.
fake-server = ["glave-ports/conformance"]

[dev-dependencies]
glave-ports = { workspace = true, features = ["conformance"] }
proptest.workspace = true
tokio = { workspace = true, features = ["rt"] }

[[test]]
name = "client"
required-features = ["fake-server"]

[lints]
workspace = true
