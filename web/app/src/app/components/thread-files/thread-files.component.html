<div class="files">
  @for (file of shown(); track file.path) {
    <details class="file" data-testid="file" open>
      <summary class="summary">
        <span class="path">{{ file.path }}</span>
        <span class="counts" aria-hidden="true"
          ><span class="plus">{{ file.added }}</span
          ><span class="minus">{{ file.removed }}</span></span
        >
        <span class="glz-visually-hidden">{{ file.label }}</span>
      </summary>
      @for (change of file.changes; track change.key) {
        <div class="change" data-testid="file-change">
          <p class="note">{{ change.note }}</p>
          <div class="diff">
            @for (line of change.lines; track $index) {
              <code class="line" [class]="line.kind"
                ><span class="sign">{{ line.sign }}</span
                >{{ line.text }}</code
              >
            }
          </div>
        </div>
      }
    </details>
  }
  <p class="note">{{ copy.commands }}</p>
</div>
