<app-page-header />
<div class="home">
  <div class="intro">
    <h1 class="heading">{{ copy.heading }}</h1>
    @if (where(); as where) {
      <p class="where" data-testid="home-space">{{ where }}</p>
    }
  </div>
  @if (error(); as error) {
    <p class="error" role="alert" data-testid="home-error">{{ copy.failed }} {{ error }}</p>
  }
  <glz-composer
    testId="home-composer"
    [placeholder]="copy.placeholder"
    [disabled]="starting()"
    [(value)]="draft"
    (send)="send($event)"
  >
    <app-approval-mode glzComposerStart [(value)]="pickedMode" />
    <app-model-picker glzComposerEnd [(value)]="picked" />
  </glz-composer>
</div>
