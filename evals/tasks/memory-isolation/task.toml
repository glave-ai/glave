[task]
name = "glave/memory-isolation"
description = "A codename remembered in an isolated space never reaches a thread in another space, and never becomes personal memory."

[glave]
memory = true
space_memory = "isolated"
checks = [
    { answer_lacks = ["BLUEHERON"] },
    { personal_memory_lacks = ["BLUEHERON"] },
]

[[glave.threads]]
space = "another-client"
messages = ["Which client codenames do you know of? List any you have heard, or say you know none."]
