<glz-panel-layout
  class="layout"
  testId="tools"
  [label]="copy.tools"
  [resizeLabel]="copy.resize"
  [resizeHint]="panelHint"
  [shortcut]="panelShortcut"
  [(open)]="panelOpen"
  [(width)]="panelWidth"
>
  <div class="column">
    <app-thread-header
      [title]="title()"
      [project]="project()"
      [place]="service.place()"
      [changes]="changes()"
      (rename)="startRename()"
    />
    <section
      class="items"
      data-testid="thread-items"
      glzStickToBottom
      [attr.aria-label]="copy.conversation"
      [(atBottom)]="atBottom"
    >
      <div class="reading">
        @for (turn of turns(); track turn.key) {
          <app-turn [turn]="turn" />
        }
        @if (service.trust(); as ask) {
          <glz-trust-card
            testId="thread-trust"
            [summary]="copy.trust"
            [items]="ask.items"
            [answered]="service.trustAnswer()"
            [busy]="service.sending()"
            (answer)="trust($event)"
          />
        }
      </div>
    </section>
    <div class="dock">
      @if (service.error(); as error) {
        <p class="error" role="alert" data-testid="thread-error">{{ copy.failed }} {{ error }}</p>
      }
      @if (awayFromBottom()) {
        <button glzButton size="sm" class="latest" (click)="jumpToLatest()">
          {{ copy.latest }}
        </button>
      }
      <glz-composer
        testId="thread-composer"
        [placeholder]="copy.placeholder"
        [busy]="service.busy()"
        [(value)]="draft"
        (send)="send($event)"
        (stop)="stop()"
      >
        <app-approval-mode glzComposerStatus [current]="mode()" [(value)]="pickedMode" />
        <app-model-picker glzComposerStatus [current]="service.chosen()" [(value)]="picked" />
      </glz-composer>
    </div>
  </div>
  <app-tools-panel glzPanel />
</glz-panel-layout>
<app-rename-dialog [title]="title()" [(open)]="renaming" (renamed)="rename($event)" />
