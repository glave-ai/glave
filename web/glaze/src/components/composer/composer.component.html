<div class="box">
  <div class="files"><ng-content select="[glzComposerAttachments]" /></div>
  @if (attachLabel(); as label) {
    <button
      glzIconButton
      type="button"
      class="attach"
      [attr.data-testid]="ids().attach"
      [label]="label"
      (click)="pick()"
    >
      <glz-icon [icon]="icons.attach" />
    </button>
    <input
      #picker
      type="file"
      multiple
      hidden
      tabindex="-1"
      [attr.data-testid]="ids().picker"
      (change)="picked($event)"
    />
  }
  <button
    glzIconButton
    type="button"
    class="options"
    [attr.data-testid]="ids().options"
    [attr.popovertarget]="statusId"
    [label]="optionsLabel()"
  >
    <glz-icon [icon]="icons.options" />
  </button>
  <textarea
    #textarea
    class="input"
    dir="auto"
    rows="1"
    [attr.data-testid]="ids().input"
    [attr.aria-label]="label()"
    [attr.aria-describedby]="hintId"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="typed($event)"
    (keydown)="keydown($event)"
    (paste)="pasted($event)"
  ></textarea>
  <div class="start"><ng-content select="[glzComposerStart]" /></div>
  <div class="acts">
    @if (busy()) {
      @if (sendBesideStop()) {
        <button
          glzIconButton
          class="act"
          variant="primary"
          [attr.data-testid]="ids().send"
          [label]="sendLabel()"
          (click)="submit()"
        >
          <glz-icon [icon]="icons.send" />
        </button>
      }
      <button
        glzIconButton
        class="act"
        variant="secondary"
        [attr.data-testid]="ids().stop"
        [label]="stopLabel()"
        (click)="stopped()"
      >
        <glz-icon [icon]="icons.stop" />
      </button>
    } @else {
      <button
        glzIconButton
        class="act"
        variant="primary"
        [attr.data-testid]="ids().send"
        [label]="sendLabel()"
        [disabled]="sendDisabled()"
        (click)="submit()"
      >
        <glz-icon [icon]="icons.send" />
      </button>
    }
  </div>
</div>
<p class="glz-visually-hidden" [id]="hintId">{{ hint() }}</p>
<div
  class="status"
  popover
  role="group"
  [id]="statusId"
  [attr.data-testid]="ids().status"
  [attr.aria-label]="optionsLabel()"
>
  <ng-content select="[glzComposerStatus]" />
</div>
