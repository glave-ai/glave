[package]
name = "glave"
description = "The glave command: run hope, or any model, on your project from the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
# The tests are one program, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "cli"
path = "tests/main.rs"

[[bin]]
name = "glave"
path = "src/main.rs"

[features]
# The web app built into glave (build.rs), so `glave` opens it with no folder to pass.
# Release builds turn it on, after `npm run build` in web/: `--features web`. Off by default,
# so building glave needs no Node; `--web <folder>` serves a build from a folder either way.
web = []
# Spans and metrics to an OpenTelemetry collector (`[telemetry] otlp`). Off by default to keep
# the binary lean: it brings the OpenTelemetry SDK and protobuf encoding.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "glave-session/otel",
]

[dependencies]
anyhow.workspace = true
getrandom.workspace = true
glave-aws.workspace = true
glave-azure.workspace = true
glave-google.workspace = true
glave-computer = { workspace = true, features = ["kubernetes"] }
glave-config.workspace = true
glave-event.workspace = true
glave-gateway.workspace = true
glave-gateway-service.workspace = true
glave-harness.workspace = true
# Blobs' bytes in glave's folder.
glave-bucket.workspace = true
glave-keys = { workspace = true, features = ["keychain"] }
glave-mcp.workspace = true
glave-memory.workspace = true
glave-ports.workspace = true
# Every process glave starts, recorded under GLAVE_HOME/run while it runs, and what a glave
# that ended left, stopped as glave starts.
glave-process.workspace = true
glave-provider-anthropic.workspace = true
glave-provider-openai.workspace = true
glave-session.workspace = true
# The data store: the local SQLite file, or Postgres for a server (`[store] url`).
glave-store-postgres.workspace = true
glave-store-sqlite.workspace = true
glave-web.workspace = true
# Times for the daily check of worktrees: how long a thread has been idle.
jiff.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
# Checking a git host's token, and signing in to GitHub in the browser (already in the tree via
# the providers).
reqwest.workspace = true
# The terminal; and for the person's server, a session of its own and `glave server stop`'s
# signal.
rustix = { workspace = true, features = ["process", "stdio", "termios"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "net", "rt", "signal", "sync", "time"] }
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
# The session API's fake identity provider signs the gateway's callers in.
aws-lc-rs.workspace = true
glave-ports = { workspace = true, features = ["conformance"] }
glave-provider-anthropic = { workspace = true, features = ["fake-server"] }
glave-provider-openai = { workspace = true, features = ["fake-server"] }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["process"] }
# Making and inspecting the Postgres test schema.
tokio-postgres.workspace = true

[[bench]]
name = "budgets"
harness = false

# Released (dist-workspace.toml), though not to crates.io, with the web app inside.
[package.metadata.dist]
dist = true
features = ["web"]

[lints]
workspace = true
