name: budgets

# The performance budgets in AGENTS.md, set in crates/session/benches/budgets.rs and measured in
# the merge queue, after every merge to main, weekly, and on demand. A pull request is not
# measured: `budgets`, the check the `main` ruleset requires, passes on it at once, and the
# merge queue measures the change before it merges, on top of the ones ahead of it.
# The binary's size and the answered command are measured on the build that ships: glave for
# x86-64 Linux as the release builds it (dist-workspace.toml), static with musl, in the dist
# profile, with the web app inside. The benchmark is built for musl too, so the thread it
# resumes runs on the allocator a released glave's does (crates/cli/src/allocator.rs). The two
# optimized builds are what cost, about 5 minutes each, nearly all of it LTO, and on one runner
# they slow each other down: so each has a runner of its own, at the same time, and a third
# measures, in seconds.
# The numbers are wall-clock, and depend on the kind of machine the measuring job is given,
# which it names. The resume of the 10,000-event thread is held instead to the instructions it
# takes, which don't depend on the machine; its milliseconds are reported beside them (#1286).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run still going; pushes to main always finish.
concurrency:
  group: budgets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  # What the release builds glave for on x86-64 Linux (dist-workspace.toml, `targets`).
  TARGET: x86_64-unknown-linux-musl

# Every job has a timeout of about three times its longest run (October 2026), so a hang fails
# in minutes rather than holding the merge queue for GitHub's six hours.
jobs:
  release:
    if: github.event_name != 'pull_request'
    # The runner the release builds x86-64 Linux on (dist's plan), so its C compiler and musl.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release-build
        id: glave
        with:
          target: ${{ env.TARGET }}
      - uses: actions/upload-artifact@v7
        with:
          name: glave
          path: ${{ steps.glave.outputs.binary }}
          if-no-files-found: error
          retention-days: 1

  benchmark:
    if: github.event_name != 'pull_request'
    # As the release's, so the same C compiler and musl.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml), with musl's standard library
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Install musl-gcc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.TARGET }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Built, not run, through `cargo xtask bench`: the benchmark alone, in a package with no
      # program of its own, so no glave is linked beside it; the one measured is the release's.
      - name: Build the benchmark
        run: |
          cargo xtask bench --bench budgets --target "$TARGET" --no-run \
            --message-format=json-render-diagnostics > built.json
          mkdir benchmark
          cp "$(jq -r 'select(.target.name == "budgets" and .executable) | .executable' built.json)" benchmark/budgets
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmark/budgets
          if-no-files-found: error
          retention-days: 1

  # On a runner nothing else uses, which is what `cargo xtask bench`'s lock is for elsewhere.
  measure:
    needs: [release, benchmark]
    runs-on: ubuntu-22.04
    # It takes seconds; the benchmark bounds its own waits, and this the rest.
    timeout-minutes: 10
    env:
      # jammy's valgrind 1:3.18.1-1ubuntu2, as its archive lists it.
      VALGRIND_SHA256: 8376c1524d187246eb09b15531c83d83567bdbc609880622a05bc8126558a221
    steps:
      # Each into a folder of its own name; the files lose their mode on the way.
      - uses: actions/download-artifact@v8
      - name: Measure it
        run: |
          chmod +x glave/glave benchmark/budgets
          echo "measured on $(nproc) cores of $(lscpu | sed -n 's/^Model name: *//p')"
          benchmark/budgets
        env:
          GLAVE_BUDGETS_BINARY: glave/glave
      # After the milliseconds, so it can't disturb them, and whether they passed or not. The
      # thread is recorded at full speed and only the resume runs under Valgrind, which counts
      # in software and needs nothing from the runner. The total needs no symbols. The count is
      # in the run's summary before the benchmark holds it to its budget, over it or not.
      # Valgrind is jammy's own package, which never changes, unpacked rather than installed: apt
      # would bring libc6-dbg (14 MB) and upgrade libc too, none of which a static program
      # counted by cachegrind uses, and the runner's mirror has crawled at 80 kB/s through all of
      # it (#1608). The package is kept in GitHub's cache, so the queue never waits on a mirror;
      # on a miss it is fetched, checked against its digest, and saved (main's runs save it for
      # the queue, whose runs can read main's cache).
      - name: Restore Valgrind
        id: cached
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: valgrind.deb
          key: valgrind_3.18.1-1ubuntu2_amd64-${{ env.VALGRIND_SHA256 }}
      - name: Fetch Valgrind
        if: ${{ !cancelled() && steps.cached.outcome == 'success' && steps.cached.outputs.cache-hit != 'true' }}
        timeout-minutes: 6
        run: |
          for mirror in http://azure.archive.ubuntu.com http://archive.ubuntu.com; do
            curl -fsSL --retry 2 --speed-limit 100000 --speed-time 30 --max-time 150 -o valgrind.deb \
              "$mirror/ubuntu/pool/main/v/valgrind/valgrind_3.18.1-1ubuntu2_amd64.deb" \
              && echo "$VALGRIND_SHA256  valgrind.deb" | sha256sum -c - && exit 0
            rm -f valgrind.deb
          done
          exit 1
      - name: Save Valgrind
        if: ${{ !cancelled() && steps.cached.outcome == 'success' && steps.cached.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: valgrind.deb
          key: valgrind_3.18.1-1ubuntu2_amd64-${{ env.VALGRIND_SHA256 }}
      - name: Unpack Valgrind
        id: valgrind
        if: ${{ !cancelled() && steps.cached.outcome == 'success' }}
        run: |
          echo "$VALGRIND_SHA256  valgrind.deb" | sha256sum -c -
          dpkg-deb -x valgrind.deb "$RUNNER_TEMP/valgrind"
      - name: Count the instructions of one resume, against its budget
        if: ${{ !cancelled() && steps.valgrind.outcome == 'success' }}
        timeout-minutes: 4
        env:
          VALGRIND_LIB: ${{ runner.temp }}/valgrind/usr/libexec/valgrind
        run: |
          benchmark/budgets record "$RUNNER_TEMP/thread"
          timeout 2m "$RUNNER_TEMP/valgrind/usr/bin/valgrind" --tool=cachegrind --cache-sim=no \
            --cachegrind-out-file=/dev/null --log-file="$RUNNER_TEMP/counted" \
            benchmark/budgets resume "$RUNNER_TEMP/thread"
          instructions=$(sed -n 's/.*I *refs: *//p' "$RUNNER_TEMP/counted")
          test -n "$instructions"
          echo "resume 10,000 events: $instructions instructions" >> "$GITHUB_STEP_SUMMARY"
          benchmark/budgets instructions "$instructions"

  # The check the ruleset requires: on a pull request it passes at once, and everywhere else
  # only when `measure` did.
  budgets:
    if: always()
    needs: measure
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Within budget
        env:
          EVENT: ${{ github.event_name }}
          MEASURE: ${{ needs.measure.result }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "Not measured on a pull request: budgets are measured in the merge queue, before the change merges, then after the merge to main and weekly."
            exit 0
          fi
          echo "measured: $MEASURE"
          test "$MEASURE" = success
