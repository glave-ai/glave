<div class="page">
  <div class="heading">
    <h1>{{ copy.heading }}</h1>
  </div>
  <div class="list">
    <glz-card>
      <h2 glzCardHeader class="section">{{ copy.appearance }}</h2>
      <glz-form-field [label]="copy.theme">
        <glz-radio-group
          data-testid="settings-theme"
          [value]="choice()"
          (valueChange)="pick($event)"
        >
          <glz-radio value="system">{{ copy.system }}</glz-radio>
          <glz-radio value="light">{{ copy.light }}</glz-radio>
          <glz-radio value="dark">{{ copy.dark }}</glz-radio>
        </glz-radio-group>
      </glz-form-field>
    </glz-card>
    <glz-card>
      <h2 glzCardHeader class="section">{{ copy.policy }}</h2>
      <p>{{ copy.policyText }}</p>
      <pre>{{ copy.policyCommand }}</pre>
    </glz-card>
    <glz-card>
      <h2 glzCardHeader class="section">{{ copy.server }}</h2>
      <p class="details" data-testid="settings-server">{{ server() }}</p>
      <div glzCardFooter>
        <button glzButton data-testid="settings-sign-out" (click)="signOut()">
          {{ copy.signOut }}
        </button>
      </div>
    </glz-card>
  </div>
</div>
