# The connectors glave offers (`specs/session.md`, "Connectors"): official remote MCP servers,
# each hosted by the vendor whose service it reaches and confirmed on that vendor's own docs
# page (`docs`). Built into glave and versioned with it, never fetched. Each works with any
# client today: `auth` is `dcr` (the person signs in, glave registering as a client) or `none`.
# `id` is stable: it names the connector to `[mcp] catalog`, to its tools (`mcp__<id>__<tool>`)
# and to the accounts ledger. `name` is the vendor's, never translated; `description` and each
# category's `name` are Fluent messages in English (`connector-<id>`, `connector-category-<id>`).

