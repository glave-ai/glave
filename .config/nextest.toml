# nextest before 0.9.145 reports tests leaky on macOS that leave nothing running: two tests
# spawned at once, one inherited the other's output pipe, since the platform cannot make a pipe
# close-on-exec atomically, and the short one was blamed for the long one holding it (#723,
# #1014: the CLI's `cloud` tests, the first its program starts, beside long ones). 0.9.145 makes
# its capture pipes itself. Required, not recommended: a warning was missed, and the false
# reports came back.
nextest-version = { required = "0.9.145" }

# A test that hangs fails instead of holding CI forever, but a slow one on a busy laptop is not
# a hang: warned after 60 s, stopped after 5 min. Tests guard their own waits more tightly
# (glave_ports::testing::HUNG), so a hang there fails sooner and says why.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# The offline cargo build inside the sandbox can run long on a busy machine: allow 10 min.
[[profile.default.overrides]]
filter = 'test(builds_with_dependencies_work_offline_in_the_sandbox)'
slow-timeout = { period = "60s", terminate-after = 10 }
