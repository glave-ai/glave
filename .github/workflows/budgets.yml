name: budgets

# The performance budgets in AGENTS.md, set in crates/cli/benches/budgets.rs and measured on the
# release build of every pull request, in the merge queue, after every merge to main, weekly,
# and on demand: the binary as it ships, with the web app inside (the `web` feature). The
# release build is what costs (about 8 minutes, beside ci.yml's jobs); measuring takes seconds.
# The numbers are wall-clock, but the budgets have room enough that a busy runner does not trip
# them; a real regression does.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run still going; pushes to main always finish.
concurrency:
  group: budgets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Saved from main only, as in ci.yml: per-PR copies would fill the repository's cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app, which the binary carries
        run: npm ci && npm run build
        working-directory: web
      - run: cargo xtask bench --bench budgets --features glave/web
