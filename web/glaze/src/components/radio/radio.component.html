<label class="choice" [class.card]="card()">
  <input
    type="radio"
    class="native"
    [name]="group.groupName"
    [value]="value()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [attr.aria-labelledby]="labelledBy()"
    [attr.aria-describedby]="describedBy()"
    (change)="pick()"
    (blur)="blurred()"
  />
  <span class="mark" aria-hidden="true"></span>
  <span class="text">
    <span [id]="labelId"><ng-content /></span>
    @if (hasHint()) {
      <span class="hint" [id]="hintId">{{ hint() }}</span>
    }
  </span>
</label>
