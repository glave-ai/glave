<glz-panel-layout
  class="layout"
  testId="tools"
  [label]="copy.tools"
  [resizeLabel]="copy.resize"
  [resizeHint]="panelHint"
  [shortcut]="panelShortcut"
  [(open)]="panelOpen"
  [(width)]="panelWidth"
>
  <div class="column">
    <app-thread-header
      [title]="title()"
      [project]="project()"
      [place]="service.place()"
      [changes]="changes()"
      (rename)="startRename()"
    />
    <section
      class="items"
      data-testid="thread-items"
      glzStickToBottom
      [attr.aria-label]="copy.conversation"
      [(atBottom)]="atBottom"
    >
      <div class="reading">
        @for (turn of turns(); track turn.key) {
          <app-turn [turn]="turn" />
        }
        @for (message of service.queued(); track message.key) {
          <glz-message from="person" data-testid="thread-queued" [author]="copy.you">
            <app-message-text [text]="message.text" />
            <p class="caption">{{ copy.queued }}</p>
          </glz-message>
        }
        @if (service.trust(); as ask) {
          <glz-trust-card
            testId="thread-trust"
            [summary]="copy.trust"
            [items]="ask.items"
            [answered]="service.trustAnswer()"
            [busy]="service.sending()"
            (answer)="trust($event)"
          />
        }
      </div>
    </section>
    <div class="dock">
      <!-- Laid over the conversation's bottom edge, just above the composer: it takes no room. -->
      <div class="float">
        <div class="latest" data-testid="thread-latest" [class.shown]="awayFromBottom()">
          <button glzButton size="sm" pill (click)="jumpToLatest()">{{ copy.latest }}</button>
        </div>
        @if (problem(); as problem) {
          <p class="error" role="alert" data-testid="thread-error">{{ problem }}</p>
        }
      </div>
      @if (gone(); as gone) {
        <app-folder-gone testId="thread-gone" [project]="gone.project" [message]="gone.message" />
      }
      <!-- Hidden rather than removed while the folder is gone, so the draft waits for it. -->
      <div [hidden]="folderGone()">
        <glz-composer
          testId="thread-composer"
          [placeholder]="copy.placeholder"
          [busy]="service.busy()"
          [attachLabel]="copy.attach"
          [attached]="attachments.count()"
          [waiting]="attachments.waiting()"
          [(value)]="draft"
          (send)="send($event)"
          (stop)="stop()"
          (attach)="attachments.add($event)"
        >
          @for (chip of attachments.chips(); track chip.key) {
            <glz-attachment
              glzComposerAttachments
              testId="thread-composer-file"
              [name]="chip.name"
              [detail]="chip.detail"
              [preview]="chip.preview"
              [busy]="chip.busy"
              [failed]="chip.failed"
              [removeLabel]="chip.removeLabel"
              (remove)="attachments.remove(chip.key)"
            />
          }
          <app-approval-mode glzComposerStatus [current]="mode()" [(value)]="pickedMode" />
          <div glzComposerStatus class="glz-row glz-gap-1">
            <app-model-picker [current]="service.chosen()" [(value)]="picked" />
            <app-effort-picker
              [model]="nextModel()"
              [current]="service.chosenEffort()"
              [(value)]="pickedEffort"
            />
          </div>
        </glz-composer>
      </div>
    </div>
  </div>
  <app-tools-panel glzPanel />
</glz-panel-layout>
<app-rename-dialog [title]="title()" [(open)]="renaming" (renamed)="rename($event)" />
