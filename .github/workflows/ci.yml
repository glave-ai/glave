name: ci

# Diagnostic run for #699 only (this branch is never merged): New project's Enter test,
# repeated in WebKit in Playwright's image as CI runs it, with half the processors kept busy,
# before the fix (the dialog as main has it) and after, and a directed check in both browsers.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  e2e-diag:
    name: e2e diag (${{ matrix.code }} ${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        code: [before, after]
        run: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: web
    env:
      GLAVE_BIN: ${{ github.workspace }}/target/debug/glave
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - name: Before the fix, the dialog as main has it
        if: matrix.code == 'before'
        run: >-
          git checkout HEAD~2 --
          app/src/app/components/new-project/new-project.component.ts
          app/src/app/components/new-project/new-project.component.html
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
        working-directory: .
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web
          save-if: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:showcase
      - name: Build glave with the app inside, and pull Playwright's image
        run: |
          .github/pull-image.sh "$PLAYWRIGHT_IMAGE" &
          cargo test -p glave --features web --test cli --no-run
          cargo build -p glave-mcp --features test-server --bin=glave-mcp-test-server
          wait $!
        working-directory: .
      - name: The image's browsers, where the scripts look for them
        run: ln -s /ms-playwright node_modules/playwright-core/.local-browsers
      # Half the processors kept busy meanwhile, as on a runner beside busy others.
      - name: the Enter test 300 times in WebKit, and the directed check, the machine kept busy
        run: |
          set +e
          burners=""
          for i in $(seq $(( $(nproc) / 2 ))); do
            sh -c 'while :; do :; done' &
            burners="$burners $!"
          done
          docker run --rm --init --ipc=host -e CI -e GLAVE_BIN \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" "$PLAYWRIGHT_IMAGE" \
            npm run e2e -- --project=webkit e2e/new-project.e2e.ts:156 --repeat-each=300 \
            --reporter=line --output=test-results/enter > enter.log 2>&1
          docker run --rm --init --ipc=host -e CI -e GLAVE_BIN \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" "$PLAYWRIGHT_IMAGE" \
            npm run e2e -- e2e/zz-diag-enter.e2e.ts --repeat-each=20 \
            --reporter=line --output=test-results/diag > diag.log 2>&1
          kill $burners
          tail -20 enter.log diag.log
          {
            echo "### ${{ matrix.code }} ${{ matrix.run }}"
            echo "Enter test, WebKit:"
            grep -E '^ +[0-9]+ (passed|failed|flaky|interrupted|did not run)' enter.log
            echo "Directed check, both browsers:"
            grep -E '^ +[0-9]+ (passed|failed|flaky|interrupted|did not run)' diag.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.code }}-${{ matrix.run }}
          path: |
            web/test-results
            web/enter.log
            web/diag.log
          if-no-files-found: ignore
