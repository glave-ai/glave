name: budgets

# A measurement for #682, reverted before review: the musl build before and after mimalloc,
# and glibc, each built as budgets.yml builds it, then measured side by side on one runner.
on:
  workflow_dispatch:
    inputs:
      arm:
        description: Also build and measure aarch64 musl
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # The commit this branch starts from: the build before the change.
  BASE: d7ac9c76ceda6e6b51aae897c26ada63684125a5
  # Symbols kept, for perf; stripping changes nothing that runs.
  CARGO_PROFILE_BENCH_STRIP: none

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-glave-base, at: base, kind: release, target: x86_64-unknown-linux-musl }
          - { name: x86-glave-head, at: head, kind: release, target: x86_64-unknown-linux-musl }
          - { name: x86-bench-musl-base, at: base, kind: bench, target: x86_64-unknown-linux-musl }
          - { name: x86-bench-musl-head, at: head, kind: bench, target: x86_64-unknown-linux-musl }
          - { name: x86-bench-musl-v2, at: head, kind: bench, target: x86_64-unknown-linux-musl, v2: true }
          - { name: x86-bench-gnu-base, at: base, kind: bench, target: x86_64-unknown-linux-gnu }
    runs-on: ubuntu-22.04
    steps: &build
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.at == 'base' && env.BASE || github.sha }}
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: musl-gcc
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
      - name: mimalloc v2
        if: matrix.v2
        run: sed -i 's/^mimalloc = "0.1.52"$/mimalloc = { version = "0.1.52", features = ["v2"] }/' Cargo.toml && grep -n '^mimalloc' Cargo.toml
      - uses: actions/setup-node@v7
        if: matrix.kind == 'release'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app
        if: matrix.kind == 'release'
        run: npm ci && npm run build
        working-directory: web
      - name: Build glave as the release does
        if: matrix.kind == 'release'
        run: |
          cargo build --locked --profile dist --target "${{ matrix.target }}" -p glave --features web
          mkdir out && cp "target/${{ matrix.target }}/dist/glave" out/glave
        env:
          RUSTFLAGS: -Ctarget-feature=+crt-static -Clink-self-contained=yes
      - name: Build the benchmark as budgets.yml does
        if: matrix.kind == 'bench'
        run: |
          cargo xtask bench --bench budgets --target "${{ matrix.target }}" --no-run \
            --message-format=json-render-diagnostics > built.json
          mkdir out
          cp "$(jq -r 'select(.target.name == "budgets" and .executable) | .executable' built.json)" out/budgets
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out
          if-no-files-found: error
          retention-days: 3

  build-arm:
    if: inputs.arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm-glave-base, at: base, kind: release, target: aarch64-unknown-linux-musl }
          - { name: arm-glave-head, at: head, kind: release, target: aarch64-unknown-linux-musl }
          - { name: arm-bench-musl-base, at: base, kind: bench, target: aarch64-unknown-linux-musl }
          - { name: arm-bench-musl-head, at: head, kind: bench, target: aarch64-unknown-linux-musl }
    runs-on: ubuntu-22.04-arm
    steps: *build

  measure:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: x86-*
      - name: Machine
        run: |
          chmod +x x86-*/*
          echo "measured on $(nproc) cores of $(lscpu | sed -n 's/^Model name: *//p')"
      - name: Size and linking
        run: |
          for v in base head; do
            echo "glave $v: $(stat -c %s x86-glave-$v/glave) bytes"
            file x86-glave-$v/glave
          done
      - name: Startup, glave --version, 300 times each, interleaved
        run: |
          for round in 1 2 3; do
            for v in base head; do
              start=$(date +%s%N)
              for i in $(seq 300); do x86-glave-$v/glave --version >/dev/null; done
              end=$(date +%s%N)
              echo "round $round glave $v: $(( (end - start) / 300000 )) us per launch"
            done
          done
      - name: The budgets benchmark, interleaved
        run: |
          for round in 1 2 3 4 5; do
            for v in musl-base musl-head musl-v2 gnu-base; do
              case $v in *base) glave=x86-glave-base/glave ;; *) glave=x86-glave-head/glave ;; esac
              echo "== round $round $v (with $glave)"
              GLAVE_BUDGETS_BINARY=$glave x86-bench-$v/budgets | grep -E 'release binary|answered|resume|record' || true
            done
          done
      - name: Where the time goes (perf, the benchmark's own process)
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q "linux-tools-$(uname -r)" linux-tools-common
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          for v in musl-base musl-head gnu-base; do
            case $v in *base) glave=x86-glave-base/glave ;; *) glave=x86-glave-head/glave ;; esac
            echo "== perf $v"
            GLAVE_BUDGETS_BINARY=$glave perf record -q -e cpu-clock -F 1999 -o perf-$v.data x86-bench-$v/budgets >/dev/null
            echo "-- by program (the benchmark is budgets; glave is the server and commands it times)"
            perf report -i perf-$v.data --stdio --sort dso 2>/dev/null | grep -v '^#' | grep -v '^$' | head -8
            echo "-- the benchmark's own code, by symbol"
            perf report -i perf-$v.data --stdio --no-children --dsos budgets --sort sym 2>/dev/null | grep -v '^#' | grep -v '^$' | head -45
          done

  measure-arm:
    if: inputs.arm
    needs: build-arm
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: arm-*
      - name: Machine
        run: |
          chmod +x arm-*/*
          echo "measured on $(nproc) cores of $(lscpu | sed -n 's/^Model name: *//p')"
      - name: Size and linking
        run: |
          for v in base head; do
            echo "glave $v: $(stat -c %s arm-glave-$v/glave) bytes"
            file arm-glave-$v/glave
            arm-glave-$v/glave --version
          done
      - name: Startup, glave --version, 300 times each, interleaved
        run: |
          for round in 1 2 3; do
            for v in base head; do
              start=$(date +%s%N)
              for i in $(seq 300); do arm-glave-$v/glave --version >/dev/null; done
              end=$(date +%s%N)
              echo "round $round glave $v: $(( (end - start) / 300000 )) us per launch"
            done
          done
      - name: The budgets benchmark, interleaved
        run: |
          for round in 1 2 3 4 5; do
            for v in base head; do
              echo "== round $round musl-$v"
              GLAVE_BUDGETS_BINARY=arm-glave-$v/glave arm-bench-musl-$v/budgets | grep -E 'release binary|answered|resume|record' || true
            done
          done
