@if (prompting()) {
  <button glzButton variant="ghost" class="install" data-testid="install-app" (click)="install()">
    <glz-icon [icon]="icon" />
    {{ copy.install }}
  </button>
}
@if (steps(); as steps) {
  <button
    #trigger
    glzButton
    variant="ghost"
    class="install"
    data-testid="install-app"
    [attr.popovertarget]="popoverId"
  >
    <glz-icon [icon]="icon" />
    {{ copy.install }}
  </button>
  <div
    #how
    popover
    class="how"
    role="note"
    data-testid="install-how"
    [id]="popoverId"
    [attr.aria-label]="copy.heading"
    (toggle)="toggled($event)"
  >
    <p class="heading">{{ copy.heading }}</p>
    <p class="steps">{{ steps }}</p>
  </div>
}
