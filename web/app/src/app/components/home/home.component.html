<app-page-header [back]="inProject()" />
<div class="home">
  <h1 class="heading">{{ copy.heading }}</h1>
  @if (problem(); as problem) {
    <p class="error" role="alert" data-testid="home-error">{{ problem }}</p>
  }
  <glz-composer
    class="composer"
    testId="home-composer"
    size="lg"
    [placeholder]="copy.placeholder"
    [disabled]="starting()"
    [attachLabel]="copy.attach"
    [attached]="attachments.count()"
    [waiting]="attachments.waiting()"
    [(value)]="draft"
    (send)="send($event)"
    (attach)="attachments.add($event)"
  >
    @for (chip of attachments.chips(); track chip.key) {
      <glz-attachment
        glzComposerAttachments
        testId="home-composer-file"
        [name]="chip.name"
        [detail]="chip.detail"
        [preview]="chip.preview"
        [busy]="chip.busy"
        [failed]="chip.failed"
        [removeLabel]="chip.removeLabel"
        (remove)="attachments.remove(chip.key)"
      />
    }
    @if (searching()) {
      <glz-icon
        glzComposerStart
        class="searching"
        data-testid="home-searching"
        [icon]="globe"
        [label]="copy.searching"
        [attr.title]="copy.searching"
      />
    }
    @if (whereInBox()) {
      <glz-menu-select
        glzComposerStart
        testId="home-where"
        outlined
        [label]="copy.where"
        [options]="places()"
        [(value)]="where"
      />
    }
    @if (whereInStatus()) {
      <glz-menu-select
        glzComposerStatus
        testId="home-where"
        outlined
        [label]="copy.where"
        [options]="places()"
        [(value)]="where"
      />
    }
    <app-permissions glzComposerStatus [(value)]="pickedPermissions" />
    <div glzComposerStatus class="glz-row glz-gap-1">
      <app-model-picker [(value)]="picked" />
      <app-effort-picker [model]="picked()" [(value)]="pickedEffort" />
    </div>
  </glz-composer>
  <!-- In a project, its room kept, unseen, until the server says a chat there may have a copy:
       the page is centred, so nothing above it moves as that comes in. -->
  @if (inProjectFolder()) {
    <glz-checkbox
      class="separate"
      testId="home-separate"
      [class.unseen]="unoffered()"
      [hint]="copy.separateHint"
      [(checked)]="separate"
      >{{ copy.separate }}</glz-checkbox
    >
  }
  @if (local()) {
    <p class="private" data-testid="home-private">
      <glz-icon [icon]="lock" />
      {{ copy.private }}
    </p>
  }
</div>
