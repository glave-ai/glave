<section id="overlays" aria-labelledby="overlays-heading">
  <h2 id="overlays-heading">{{ copy.heading }}</h2>

  <div class="glz-row">
    <button glzButton data-testid="showcase-open-dialog" (click)="openRename()">
      {{ copy.openDialog }}
    </button>
    <button glzButton variant="danger" data-testid="showcase-open-confirm" (click)="openConfirm()">
      {{ copy.openConfirm }}
    </button>
    <button glzButton data-testid="showcase-open-long" (click)="openLong()">
      {{ copy.openLong }}
    </button>
  </div>
  <glz-dialog testId="showcase-dialog" [heading]="copy.dialogHeading" [(open)]="renaming">
    <glz-form-field [label]="copy.title">
      <input glzInput data-testid="showcase-dialog-title" />
    </glz-form-field>
    <div glzDialogActions class="glz-row glz-gap-2">
      <button glzButton data-testid="showcase-dialog-cancel" (click)="closeRename()">
        {{ copy.cancel }}
      </button>
      <button
        glzButton
        variant="primary"
        data-testid="showcase-dialog-save"
        (click)="closeRename()"
      >
        {{ copy.save }}
      </button>
    </div>
  </glz-dialog>
  <glz-confirm-dialog
    testId="showcase-confirm"
    danger
    [heading]="copy.confirmHeading"
    [message]="copy.confirmMessage"
    [confirmLabel]="copy.delete"
    [(open)]="confirming"
  />
  <glz-dialog testId="showcase-long" [heading]="copy.longHeading" [(open)]="choosing">
    @for (choice of choices; track choice) {
      <glz-checkbox>{{ choice }}</glz-checkbox>
    }
    <div glzDialogActions class="glz-row glz-gap-2">
      <button glzButton variant="primary" data-testid="showcase-long-done" (click)="closeLong()">
        {{ copy.done }}
      </button>
    </div>
  </glz-dialog>
</section>
