<details class="details" [open]="open()" (toggle)="toggled($event)">
  <summary class="line" [attr.data-testid]="ids().summary">
    @if (icon(); as kind) {
      <glz-icon class="kind" [icon]="kind" />
    }
    <span class="what">{{ summary() }}</span>
    <glz-icon
      class="status"
      [class.glz-spin]="running()"
      [icon]="statusIcon()"
      [label]="statusWord()"
    />
  </summary>
  <div class="evidence" [attr.data-testid]="ids().evidence"><ng-content /></div>
</details>
