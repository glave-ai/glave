@if (hasHeader()) {
  <div class="header">
    @if (collapsible()) {
      <button
        type="button"
        class="heading toggle"
        [id]="headingId"
        [attr.data-testid]="ids().toggle"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="itemsId"
        [attr.aria-describedby]="endId"
        (click)="toggle()"
      >
        <span class="text">{{ heading() }}</span>
        <glz-icon
          class="caret glz-mirrored"
          [icon]="icons.caret"
          [attr.data-testid]="ids().caret"
        />
      </button>
    } @else {
      <p class="heading" [id]="headingId">{{ heading() }}</p>
    }
    <!-- One slot each: content goes to the first slot that matches. -->
    <span class="actions"><ng-content select="[glzNavListActions]" /></span>
    <span class="end" [id]="endId" [attr.data-testid]="ids().end">
      <ng-content select="[glzNavListEnd]" />
    </span>
  </div>
}
<div class="items" [id]="itemsId" [attr.data-testid]="ids().items" [hidden]="collapsed()">
  <ng-content />
</div>
