[package]
name = "harness"
version = "0.1.0"
edition = "2021"
description = "Glave eval harness — deterministic skeleton (slice 1)"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
