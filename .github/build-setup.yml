# Steps the release workflow runs before dist builds glave (dist-workspace.toml): the pinned
# Rust toolchain, the web app, which release builds carry (the `web` feature), and the notices
# of the third-party code in both.
- name: Install the pinned toolchain (rust-toolchain.toml)
  run: rustup toolchain install
- name: Install Node
  uses: actions/setup-node@v7
  with:
    node-version: 22
    cache: npm
    cache-dependency-path: web/package-lock.json
# In web/ by `cd`: dist leaves out a step's `working-directory`.
- name: Build the web app, which the binary carries
  run: cd web && npm ci && npm run build
# Every archive carries them (dist-workspace.toml): the licences of the Rust crates glave links
# for the target this job builds (dist's matrix, one target a job), then those of the npm
# packages in the web app. CI runs the same script for every target, on every pull request.
- name: Write the third-party notices
  env:
    TARGET: ${{ join(matrix.targets, ' ') }}
  run: sh .github/third-party-notices.sh "$TARGET"
