@if (modal()) {
  <div class="scrim" [attr.data-testid]="ids().scrim" aria-hidden="true" (click)="close()"></div>
}
<aside
  #sidenav
  class="sidenav"
  tabindex="-1"
  [id]="navId"
  [attr.data-testid]="ids().nav"
  [attr.aria-label]="label()"
  [attr.aria-modal]="ariaModal()"
  [attr.role]="role()"
  [inert]="closed()"
>
  <ng-content select="[glzSidenav]" />
</aside>
@if (showHandle()) {
  <div
    class="handle"
    side="start"
    glzTooltipPosition="end"
    [glzSplitter]="navId"
    [glzSplitterPanel]="sidenav"
    [glzTooltip]="resizeHint()"
    [minWidth]="minWidth"
    [maxWidth]="maxWidth"
    [attr.data-testid]="ids().handle"
    [attr.aria-label]="resizeLabel()"
    [attr.aria-keyshortcuts]="shortcut()"
    [(open)]="open"
    [(width)]="width"
  ></div>
}
<div class="content" [inert]="modal()"><ng-content /></div>
