[package]
name = "glave-process"
description = "Every operating-system process glave owns: started in one place, in a process group of its own, stopped at once by a helper of glave's own when glave ends however it ends, recorded in a ledger while it runs, and stopped at the next start when the glave that owned it is gone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Writing each entry whole (`file`).
glave-ports.workspace = true
# Signalling a process group, and seeing whether one is still there; the machine's name;
# waiting, within a limit, for glave to let a program it starts run.
rustix = { workspace = true, features = ["event", "process", "system"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
# The runtime tests run on (`block_on!`).
glave-ports = { workspace = true, features = ["conformance"] }

[lints]
workspace = true
