[package]
name = "glave-session"
description = "glave's session API: the one boundary every surface uses to run threads and turns, over any transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one binary, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "session"
path = "tests/main.rs"

[features]
# A request's span joins the caller's W3C trace in OpenTelemetry (the CLI's `otlp` feature).
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
# thread/list's cursors, opaque to clients (cursor.rs).
base64.workspace = true
# The server's own sentences, in the caller's language (words.rs).
fluent-bundle.workspace = true
glave-event.workspace = true
glave-harness.workspace = true
# Sign-in on network transports, and who is calling.
glave-identity.workspace = true
# The names MCP tools reach the model by, to count each connection's calls (usage.rs).
glave-mcp.workspace = true
glave-ports.workspace = true
# Each web page's CSP nonce, straight from the operating system (http/site.rs).
getrandom.workspace = true
# The HTTP transport's server.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff.workspace = true
opentelemetry = { workspace = true, optional = true }
# The client of a session server elsewhere (`client`), on the HTTP stack glave already uses.
reqwest = { workspace = true, features = ["json"] }
# HTTPS of the server's own: the handshakes, answered as glave-acme says (`http/listen.rs`).
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The scheduler waits for the next due run with a timer.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
# A content-free span for each request.
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
# The software authenticator the passkey tests sign in with.
glave-identity = { workspace = true, features = ["fake-authenticator"] }
glave-computer.workspace = true
glave-keys.workspace = true
glave-memory.workspace = true
glave-ports = { workspace = true, features = ["conformance"] }
glave-store-sqlite.workspace = true
# web_fetch reading a local page, for the sources a reply drew on.
glave-web = { workspace = true, features = ["pages"] }
# The isolation suite on Postgres too, when a test database is given.
glave-store-postgres.workspace = true
tokio-postgres.workspace = true
# Property tests for the cron parser (AGENTS.md: parsers get property tests).
proptest.workspace = true
# A photo made in the test, to upload and see resized.
image.workspace = true

[lints]
workspace = true
