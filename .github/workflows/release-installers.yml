name: release installers

# The ways a person installs a release, tried by the Release run that calls this workflow
# (dist-workspace.toml, `global-artifacts-jobs`) on the archives it built, before it publishes
# anything, and in a dry run: dist's install script (`curl … | sh`) on every platform the
# release builds for, and the server installer (install/server.sh) on each Linux one. Each
# fetches its archive from a server on the runner, as it would from the release on GitHub
# (GLAVE_DOWNLOAD_URL), and checks it against its checksum.
on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan of the calling run, as JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  # dist's install script is written by the calling run's build-global-artifacts, which runs
  # beside this workflow, so it is written here the same way: the run's dist, its archives and
  # their checksums, and the tag it releases.
  script:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the run's dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch the run's archives
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Write the install script
        env:
          TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: dist build --tag="$TAG" --artifacts=global --output-format=json >/dev/null
      # Not named artifacts-*, which the release publishes.
      - uses: actions/upload-artifact@v7
        with:
          name: installer-script
          path: target/distrib/glave-installer.sh

  # On the runners the release builds on, one platform each (dist's matrix).
  install:
    name: install (${{ join(matrix.targets, ', ') }})
    needs: script
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch this platform's archive
        uses: actions/download-artifact@v8
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: release/
      - name: Fetch the install script
        uses: actions/download-artifact@v8
        with:
          name: installer-script
          path: release/
      # Over HTTPS on Linux, under a certificate made here, since the server installer fetches
      # nothing else; dist's script takes plain HTTP too, which is all macOS is given.
      - name: Serve them from this runner
        run: |
          ls -l release
          serve=(python3 -m http.server 8443 --bind 127.0.0.1 --directory release)
          if [ "$RUNNER_OS" = Linux ]; then
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
              -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1 \
              -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null
            cat >"$RUNNER_TEMP/serve.py" <<'EOF'
          import functools, http.server, ssl, sys
          folder, cert, key = sys.argv[1:]
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=folder)
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 8443), handler)
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain(cert, key)
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          EOF
            serve=(python3 "$RUNNER_TEMP/serve.py" release "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem")
            export CURL_CA_BUNDLE="$RUNNER_TEMP/cert.pem"
            echo "CURL_CA_BUNDLE=$CURL_CA_BUNDLE" >>"$GITHUB_ENV"
            url=https://127.0.0.1:8443
          else
            url=http://127.0.0.1:8443
          fi
          nohup "${serve[@]}" >"$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$url/glave-installer.sh"; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null "$url/glave-installer.sh"
          echo "GLAVE_DOWNLOAD_URL=$url" >>"$GITHUB_ENV"
      - name: curl … | sh installs glave, checked against its checksum
        run: |
          curl -fsSL "$GLAVE_DOWNLOAD_URL/glave-installer.sh" | sh 2>&1 | tee "$RUNNER_TEMP/installed.txt"
          if grep -q "no checksums to verify" "$RUNNER_TEMP/installed.txt"; then
            echo "the install script checked no checksum"
            exit 1
          fi
          "$HOME/.local/bin/glave" --version
      - name: The server installer installs glave as a service, checked against its checksum
        if: runner.os == 'Linux'
        run: |
          sh install/server.sh --origin https://glave.test 2>&1 | tee "$RUNNER_TEMP/server.txt"
          grep -q "downloading glave from $GLAVE_DOWNLOAD_URL" "$RUNNER_TEMP/server.txt"
          grep -q 'https://glave.test/#setup=' "$RUNNER_TEMP/server.txt"
          systemctl is-active glave
          if sudo journalctl -u glave -o cat | grep -F "sandbox cannot run"; then exit 1; fi
          sudo -u glave -H glave server link | grep -q '/#setup='
      - name: What the server said
        if: failure()
        run: |
          cat "$RUNNER_TEMP/serve.log" || true
          if [ "$RUNNER_OS" = Linux ]; then sudo journalctl -u glave --no-pager -o cat | tail -100; fi
