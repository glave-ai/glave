<div class="new">
  <a glzButton variant="primary" routerLink="/" data-testid="nav-new-chat" (click)="followed()">
    <glz-icon [icon]="icons.add" />
    {{ copy.newChat }}
  </a>
</div>
<nav class="lists" [attr.aria-label]="copy.threads">
  @for (list of lists(); track list.id) {
    <glz-nav-list data-testid="nav-space" [heading]="list.name">
      @for (thread of list.threads; track thread.id) {
        <a
          glzNavItem
          data-testid="nav-thread"
          [routerLink]="thread.link"
          [current]="thread.current"
          [icon]="icons.thread"
          (click)="followed()"
        >
          {{ thread.title }}
          @if (thread.mark; as mark) {
            <glz-badge glzNavItemEnd [tone]="mark.tone">{{ mark.text }}</glz-badge>
          }
        </a>
      } @empty {
        <p class="empty">{{ copy.empty }}</p>
      }
    </glz-nav-list>
  }
</nav>
