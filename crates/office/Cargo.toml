[package]
name = "glave-office"
description = "glave's office files for `glave doc`: workbooks read with calamine and written with rust_xlsxwriter, Word and PowerPoint read as their XML, any Office file unpacked and packed to edit in place, PDFs' pages and forms changed with lopdf, with the built-in skills that teach it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one program, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "office"
path = "tests/main.rs"

[dependencies]
calamine.workspace = true
lopdf.workspace = true
quick-xml.workspace = true
rust_xlsxwriter.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
glave-ports = { workspace = true, features = ["conformance"] }
proptest.workspace = true

[lints]
workspace = true
