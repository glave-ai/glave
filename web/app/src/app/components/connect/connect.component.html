<header>
  <glz-top-bar>{{ copy.name }}</glz-top-bar>
</header>
<main class="page">
  <h1>{{ copy.heading }}</h1>
  <p class="lead">{{ copy.lead }}</p>
  <form class="glz-stack" data-testid="connect" (submit)="connect($event)">
    <glz-form-field [label]="copy.service">
      <glz-radio-group
        cards
        data-testid="connect-service"
        [value]="picked()"
        (valueChange)="pick($event)"
      >
        @for (service of services(); track service.kind) {
          <glz-radio [value]="service.kind" [hint]="service.hint">{{ service.name }}</glz-radio>
        }
      </glz-radio-group>
    </glz-form-field>
    @if (asksAddress()) {
      <glz-form-field [label]="copy.address" [hint]="copy.addressHint">
        <input
          glzInput
          type="url"
          autocomplete="off"
          spellcheck="false"
          data-testid="connect-address"
          [value]="address()"
          (input)="typedAddress($event)"
        />
      </glz-form-field>
    }
    <glz-form-field [label]="copy.key" [hint]="copy.keyHint">
      <input
        glzInput
        type="password"
        autocomplete="off"
        spellcheck="false"
        data-testid="connect-key"
        [value]="key()"
        (input)="typedKey($event)"
      />
    </glz-form-field>
    @if (problem(); as problem) {
      <p class="problem" role="alert" data-testid="connect-problem">{{ problem }}</p>
    }
    <div class="actions glz-row glz-gap-2">
      @if (adding()) {
        <button glzButton type="button" data-testid="connect-back" (click)="back()">
          {{ copy.back }}
        </button>
      }
      <button
        glzButton
        variant="primary"
        type="submit"
        data-testid="connect-submit"
        [disabled]="busy()"
      >
        {{ label() }}
      </button>
    </div>
  </form>
</main>
