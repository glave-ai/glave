@if (!decided()) {
  <p class="label" [id]="labelId"><span class="dot" aria-hidden="true"></span>{{ label() }}</p>
}
<p class="summary" [id]="summaryId">
  {{ summary() }}
  @if (hasDetail()) {
    <code class="detail">{{ detail() }}</code>
  }
</p>
@if (hasCaution()) {
  <p class="caution" [id]="cautionId" [attr.data-testid]="ids().caution">{{ caution() }}</p>
}
@if (decidedText(); as decided) {
  <p class="decided" [attr.data-testid]="ids().decided">{{ decided }}</p>
} @else {
  <div class="actions">
    <button
      glzButton
      variant="primary"
      [attr.data-testid]="ids().allowOnce"
      [disabled]="busy()"
      (click)="allowOnce()"
    >
      {{ allowOnceLabel() }}
    </button>
    <button
      glzButton
      [attr.data-testid]="ids().allowThread"
      [disabled]="busy()"
      (click)="allowForThread()"
    >
      {{ allowForThreadLabel() }}
    </button>
    <button glzButton [attr.data-testid]="ids().deny" [disabled]="busy()" (click)="deny()">
      {{ denyLabel() }}
    </button>
  </div>
}
