[package]
name = "glave-harness"
description = "glave's agent loop: the tools, approvals, and every step recorded as events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
glave-event.workspace = true
glave-ports.workspace = true
glave-shell.workspace = true
jiff.workspace = true
# Hook matchers are regular expressions over tool names, as Claude Code and Codex write them.
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
# Tests run the tools on this machine as a computer, as the CLI does.
glave-computer.workspace = true
glave-ports = { workspace = true, features = ["conformance"] }
proptest.workspace = true
uuid.workspace = true

[lints]
workspace = true
