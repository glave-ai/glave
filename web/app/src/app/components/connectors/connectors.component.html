@if (offered()) {
  <section class="glz-stack glz-gap-4" aria-labelledby="connectors-heading">
    <h2 id="connectors-heading" class="heading">{{ copy.heading }}</h2>
    @if (here(); as here) {
      <p class="detail" data-testid="connectors-here">{{ here }}</p>
    }
    <label class="search">
      <glz-icon [icon]="icons.search" />
      <input
        type="search"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        data-testid="connectors-search"
        [attr.aria-label]="copy.search"
        [placeholder]="copy.search"
        [value]="query()"
        (input)="search($event)"
      />
    </label>
    @for (section of sections(); track section.id) {
      <section class="card" [attr.data-testid]="section.testId" [attr.aria-labelledby]="section.id">
        <h3 class="head" [id]="section.id">{{ section.heading }}</h3>
        <div class="rows" role="list">
          @for (row of section.rows; track row.connector.id) {
            <app-connector-row
              [connector]="row.connector"
              [waiting]="row.waiting"
              [working]="row.working"
              [problem]="row.problem"
              [choosing]="choosing()"
              [places]="places()"
              (acted)="acted(row.connector, $event)"
            />
          }
        </div>
      </section>
    }
    <p class="detail" role="status" data-testid="connectors-none">{{ found() }}</p>
  </section>
}
@if (problem(); as problem) {
  <p class="detail problem" role="alert" data-testid="connectors-problem">{{ problem }}</p>
}
<app-rename-dialog
  kind="account"
  [title]="renameShown().title"
  [heading]="renameShown().heading"
  [note]="renameShown().note"
  [(open)]="renameOpen"
  (renamed)="renamed($event)"
/>
<app-connector-add
  [connector]="adding()"
  [here]="project()"
  [hereName]="projectName()"
  [places]="places()"
  [(open)]="addOpen"
  (chosen)="added($event)"
/>
<glz-confirm-dialog
  testId="connectors-disconnect"
  danger
  [heading]="disconnectHeading()"
  [message]="copy.disconnectText"
  [confirmLabel]="copy.disconnect"
  [(open)]="confirming"
  (decided)="decided($event)"
/>
