# Weekly, grouped: at most one pull request per ecosystem per week, titled chore(deps): ... so
# it passes the title check. A version update waits until its release is 7 days old
# (`cooldown`), the age `cargo xtask package-age` requires of every new version, so the check
# passes it. Security updates come separately, as soon as an advisory lands; the cooldown
# doesn't hold them.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    # release.yml is generated (`cargo xtask release-workflow`), so a version update there fails
    # CI's check of it. dist writes its actions at dist's own defaults unless dist-workspace.toml
    # pins one ([dist.github-action-commits]), and glave's own steps come from
    # .github/build-setup.yml. Dependabot reads neither file: both are bumped by hand, security
    # updates included.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
  # The web app, Glaze and the client: one npm package (web/package.json). When Playwright
  # moves, ci.yml's e2e image moves with it by hand: the tests name the one they need.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 2
