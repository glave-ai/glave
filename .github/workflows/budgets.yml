name: budgets

# A measurement for #682, reverted before review: the musl build before and after mimalloc
# (no_thp), and glibc, each built as budgets.yml builds it, then measured side by side on one
# runner.
on:
  workflow_dispatch:
    inputs:
      arm:
        description: Also build and measure aarch64 musl
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # The commit this branch starts from: the build before the change.
  BASE: d7ac9c76ceda6e6b51aae897c26ada63684125a5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-glave-base, at: base, kind: release, target: x86_64-unknown-linux-musl }
          - { name: x86-glave-head, at: head, kind: release, target: x86_64-unknown-linux-musl }
          - { name: x86-bench-musl-base, at: base, kind: bench, target: x86_64-unknown-linux-musl }
          - { name: x86-bench-musl-head, at: head, kind: bench, target: x86_64-unknown-linux-musl }
          - { name: x86-bench-gnu-base, at: base, kind: bench, target: x86_64-unknown-linux-gnu }
    runs-on: ubuntu-22.04
    steps: &build
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.at == 'base' && env.BASE || github.sha }}
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: musl-gcc
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
      - uses: actions/setup-node@v7
        if: matrix.kind == 'release'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app
        if: matrix.kind == 'release'
        run: npm ci && npm run build
        working-directory: web
      - name: Build glave as the release does
        if: matrix.kind == 'release'
        run: |
          cargo build --locked --profile dist --target "${{ matrix.target }}" -p glave --features web
          mkdir out && cp "target/${{ matrix.target }}/dist/glave" out/glave
        env:
          RUSTFLAGS: -Ctarget-feature=+crt-static -Clink-self-contained=yes
      - name: Build the benchmark as budgets.yml does
        if: matrix.kind == 'bench'
        run: |
          cargo xtask bench --bench budgets --target "${{ matrix.target }}" --no-run \
            --message-format=json-render-diagnostics > built.json
          mkdir out
          cp "$(jq -r 'select(.target.name == "budgets" and .executable) | .executable' built.json)" out/budgets
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out
          if-no-files-found: error
          retention-days: 3

  build-arm:
    if: inputs.arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm-glave-base, at: base, kind: release, target: aarch64-unknown-linux-musl }
          - { name: arm-glave-head, at: head, kind: release, target: aarch64-unknown-linux-musl }
          - { name: arm-bench-musl-base, at: base, kind: bench, target: aarch64-unknown-linux-musl }
          - { name: arm-bench-musl-head, at: head, kind: bench, target: aarch64-unknown-linux-musl }
    runs-on: ubuntu-22.04-arm
    steps: *build

  measure:
    needs: build
    runs-on: ubuntu-22.04
    steps: &measure
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ runner.arch == 'ARM64' && 'arm' || 'x86' }}-*
          path: in
      - name: Machine
        run: |
          cd in && for d in *-*; do mv "$d" "${d#*-}"; done && chmod +x */*
          echo "measured on $(nproc) cores of $(lscpu | sed -n 's/^Model name: *//p') ($(uname -m))"
          echo "THP enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
      - name: Size and linking
        working-directory: in
        run: |
          for v in base head; do
            echo "glave $v: $(stat -c %s glave-$v/glave) bytes"
            file glave-$v/glave
            glave-$v/glave --version
          done
      - name: Startup (a loop, glave --version, 300 runs each, interleaved)
        working-directory: in
        run: |
          for round in 1 2 3; do
            for v in base head; do
              start=$(date +%s%N)
              for i in $(seq 300); do glave-$v/glave --version >/dev/null; done
              end=$(date +%s%N)
              echo "round $round glave $v: $(( (end - start) / 300000 )) us per launch"
            done
          done
      - name: Startup (perf stat, glave --version, 300 runs each, interleaved)
        continue-on-error: true
        working-directory: in
        run: |
          sudo sysctl -q -w kernel.perf_event_paranoid=-1
          for round in 1 2 3; do
            for v in base head; do
              echo "== round $round $v"
              perf stat -r 300 -e task-clock,page-faults glave-$v/glave --version 2>&1 >/dev/null | grep -E 'task-clock|page-faults|elapsed'
            done
          done
      - name: The budgets benchmark, interleaved
        working-directory: in
        run: |
          for round in 1 2 3 4 5; do
            for v in musl-base musl-head gnu-base; do
              [ -x bench-$v/budgets ] || continue
              case $v in *head) glave=glave-head/glave ;; *) glave=glave-base/glave ;; esac
              echo "== round $round $v (with $glave)"
              GLAVE_BUDGETS_BINARY=$glave bench-$v/budgets | grep -E 'release binary|answered|resume|record' || true
            done
          done

  measure-arm:
    if: inputs.arm
    needs: build-arm
    runs-on: ubuntu-22.04-arm
    steps: *measure
