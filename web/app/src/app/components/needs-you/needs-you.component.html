<button glzNavItem data-testid="needs-you" [icon]="icon" [glzPopoverTrigger]="list">
  {{ copy.label }}
  @if (count(); as count) {
    <glz-badge glzNavItemEnd tone="accent" data-testid="needs-you-count">{{ count }}</glz-badge>
  }
</button>
<glz-popover #list testId="needs-you-list">
  @for (thread of threads(); track thread.id) {
    <a glzNavItem data-testid="needs-you-thread" [routerLink]="thread.link" (click)="followed()">
      {{ thread.title }}
      <span glzNavItemEnd class="place">{{ thread.place }}</span>
    </a>
  } @empty {
    <p class="empty" data-testid="needs-you-none">{{ copy.none }}</p>
  }
</glz-popover>
