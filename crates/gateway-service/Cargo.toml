[package]
name = "glave-gateway-service"
description = "glave's gateway as a service: OpenAI and Anthropic surfaces over HTTP, every call signed in, metered per caller, and the organization's MCP tool catalog at /mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
glave-event.workspace = true
glave-gateway.workspace = true
# Sign-in: the same OIDC verifier as the session API, so both services trust callers alike.
glave-identity.workspace = true
# The catalog's servers, each reached through glave's MCP client.
glave-mcp.workspace = true
glave-ports.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff.workspace = true
# The catalog served over MCP's Streamable HTTP, by the SDK glave's MCP client already uses.
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
aws-lc-rs.workspace = true
glave-provider-anthropic = { workspace = true, features = ["fake-server"] }
glave-provider-openai = { workspace = true, features = ["fake-server"] }
reqwest.workspace = true
uuid.workspace = true

[lints]
workspace = true
