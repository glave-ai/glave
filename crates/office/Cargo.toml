[package]
name = "glave-office"
description = "glave's office files: workbooks read with calamine for `glave doc`, with the built-in skill that teaches it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one program, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "office"
path = "tests/main.rs"

[dependencies]
calamine.workspace = true
thiserror.workspace = true

[dev-dependencies]
glave-ports = { workspace = true, features = ["conformance"] }

[lints]
workspace = true
