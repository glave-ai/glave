# A test that hangs fails instead of holding CI forever: warned after 30 s, stopped after 2 min.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# The offline cargo build inside the sandbox can run past 2 min on a busy machine: allow ~6 min.
[[profile.default.overrides]]
filter = 'test(builds_with_dependencies_work_offline_in_the_sandbox)'
slow-timeout = { period = "60s", terminate-after = 6 }
