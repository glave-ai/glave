@if (shown()) {
  <glz-nav-list testId="needs-you" [heading]="copy.label">
    @for (thread of threads(); track thread.id) {
      <a
        glzNavItem
        data-testid="needs-you-thread"
        [routerLink]="thread.link"
        [current]="thread.current"
        (click)="followed()"
      >
        <!-- The title in its own direction; the space after it keeps it apart from its place. -->
        <span dir="auto">{{ thread.title }} </span>
        @if (thread.place; as place) {
          <span glzNavItemEnd class="place">{{ place }}</span>
        }
      </a>
    }
  </glz-nav-list>
}
