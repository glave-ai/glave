id = "rust-rpn-eval-001"
language = "rust"
archetype = "bug-fix-in-context"
difficulty = "high"
codebase_size = "small"
editable_surface = ["src/**/*.rs"]

[provenance]
source = "authored"
contamination = "none"
calibration = false

[image]
base = "glave/rust-base:latest"
workdir = "/work"

[oracle]
fail_to_pass = "mkdir -p tests && cp /oracle/integration_test.rs tests/ && cargo test --test integration_test -- subtraction_order division_order"
pass_to_pass = "mkdir -p tests && cp /oracle/integration_test.rs tests/ && cargo test --test integration_test -- addition multiplication"

[resource]
mem_mb = 1024
cpus = 2.0
pids = 512
network = "none"
