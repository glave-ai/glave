<div class="top">
  <span class="name">{{ copy.name }}</span>
  <a
    glzIconButton
    class="new"
    routerLink="/"
    data-testid="nav-new-chat"
    [label]="copy.newChat"
    (click)="followed()"
  >
    <glz-icon [icon]="icons.newChat" />
  </a>
</div>
<label class="search">
  <glz-icon [icon]="icons.search" />
  <input
    type="search"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    data-testid="nav-search"
    [attr.aria-label]="copy.search"
    [placeholder]="copy.searchPlaceholder"
    [value]="query()"
    (input)="search($event)"
  />
</label>
<app-projects-nav
  class="threads"
  [current]="current()"
  [query]="query()"
  (navigated)="followed()"
/>
<div class="foot">
  @if (tasksLive()) {
    <a
      glzNavItem
      data-testid="nav-tasks"
      [routerLink]="tasksLink"
      [current]="tasksCurrent()"
      [icon]="icons.tasks"
      (click)="followed()"
    >
      {{ copy.tasks }}
      @if (tasksGoing(); as going) {
        <span glzNavItemEnd class="going"
          >{{ going }} <span class="glz-visually-hidden">{{ copy.going }}</span></span
        >
      }
    </a>
  }
  <app-person (navigated)="followed()" />
</div>
