[graph]
all-features = true

[advisories]
# Each entry says why it is safe and when it goes.
ignore = [
    # zvariant, zbus_names and zvariant_derive were merged into zbus 6: "unmaintained" notices
    # about the crates' names, not security flaws. They arrive through keyring's Linux secret
    # store (keyring -> secret-service -> zbus 5), which has no zbus 6 release yet. Remove these
    # when secret-service moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; no fix through keyring yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; no fix through keyring yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; no fix through keyring yet" },
    # rsa's Marvin attack recovers a private key from the timing of operations with it
    # (decrypting, signing). glave holds no RSA private key: webauthn-rs, through crypto-glue,
    # uses rsa only to check the RS256 signatures of passkeys with their public keys. Remove
    # when rsa has a constant-time release.
    { id = "RUSTSEC-2023-0071", reason = "rsa only checks passkey signatures with public keys" },
    # crypto-bigint 0.5's timing leaks matter for arithmetic on secret integers. It reaches glave
    # only through webauthn-rs (crypto-glue -> elliptic-curve 0.13), which uses it to check
    # passkeys' ECDSA signatures with their public keys: glave holds no EC private key there.
    # The fix is in 0.7.6, which elliptic-curve 0.13 can't take. Remove when webauthn-rs moves to
    # elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only checks passkey signatures with public keys" },
]

[licenses]
# about.toml accepts the same licences for the release archives' third-party notices: change both.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    # Permissive data license (Linux Foundation) on Mozilla's root-certificate bundle, used
    # by rustls when the OS trust store is unavailable. No copyleft.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
