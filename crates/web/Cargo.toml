[package]
name = "glave-web"
description = "glave's web_fetch tool: private addresses refused at every hop, limits, a host policy, HTML as Markdown, its output marked untrusted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glave-event.workspace = true
glave-ports.workspace = true
# HTML to Markdown, as Claude Code and OpenCode give pages to the model (Turndown's design).
htmd.workspace = true
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }
# Reading the host of a URL as an address (already in the tree, under reqwest).
url.workspace = true

[features]
# A tiny local web server for tests and evals.
pages = ["tokio/io-util", "tokio/sync"]

[dev-dependencies]
glave-ports = { workspace = true, features = ["conformance"] }

[[test]]
name = "fetch"
required-features = ["pages"]

[lints]
workspace = true
