name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run still going; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Incremental data is never reused across runs, so writing it only costs time. Build caches
# (the registry and dependencies, not workspace crates) are saved from main only, and pull
# requests restore them: per-PR copies pushed the repository past its 10 GB cache limit.
env:
  CARGO_INCREMENTAL: "0"
  # The web checks run in the `web` job; `cargo xtask ci` in the Rust jobs skips them.
  GLAVE_SKIP_WEB: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    # A real Postgres, so the Postgres store runs its conformance suites here instead of
    # skipping them.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: glave
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    # The runner's own Docker, so the Docker worker backend runs its tests here too (a small
    # alpine image pinned by digest, a stub in glave's place). Everything they make is
    # labelled glave.test=<run id>, which this job sweeps, and glave.test.case=<id> per test,
    # which each test checks so it never sees the containers of a test running beside it.
    env:
      GLAVE_TEST_POSTGRES_URL: postgres://postgres:glave@localhost:5432/postgres
      # The S3-compatible bucket a step below starts, so the bucket's suites run here too.
      GLAVE_TEST_S3_URL: s3://glave-test
      GLAVE_TEST_S3_ENDPOINT: http://localhost:8333
      GLAVE_TEST_DOCKER: "1"
      # A real worker too: the glave this job builds (Linux, the runner's processor), in an
      # image with bash and git whose glibc is the runner's (Ubuntu 24.04), pinned.
      GLAVE_TEST_WORKER_GLAVE: ${{ github.workspace }}/target/debug/glave
      GLAVE_TEST_WORKER_IMAGE: buildpack-deps:noble-scm@sha256:4163ac2c58660c533f3cf3d178551287ddd0ac18269ef84f3a382d0698c89254
    steps:
      # Linking every test binary of the workspace fills the runner's disk (ld dies with a bus
      # error), so the toolchains the runner ships and glave never uses go first (about 30 GB).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@v7
      # SeaweedFS (Apache-2.0) as an S3-compatible bucket, pinned by digest. A service container
      # cannot be given its command (`server -s3`), so a step starts it, and makes the tests'
      # bucket once it answers. It keeps no keys, so the tests send their requests unsigned.
      - name: Start an S3-compatible bucket
        run: |
          docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62 server -s3
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null -X PUT http://localhost:8333/glave-test; then exit 0; fi
            sleep 1
          done
          docker logs seaweedfs
          exit 1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      - run: cargo xtask ci
      - name: Disk space after the build
        if: always()
        run: df -h /
      - name: Nothing the Docker tests made is left behind
        if: always()
        run: |
          label="label=glave.test=${{ github.run_id }}"
          left="$(docker ps -aq --filter "$label")$(docker ps -aq --filter label=glave.worker)$(docker volume ls -q --filter "$label")$(docker network ls -q --filter "$label")"
          # The worker image is shared by two tests running at once, so it is removed here.
          docker image rm "$GLAVE_TEST_WORKER_IMAGE" >/dev/null 2>&1 || true
          if docker image inspect "$GLAVE_TEST_WORKER_IMAGE" >/dev/null 2>&1; then
            echo "the worker image is left behind"
            exit 1
          fi
          if [ -n "$left" ]; then
            echo "left behind: $left"
            exit 1
          fi
          if docker image inspect "alpine@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507" >/dev/null 2>&1; then
            echo "the test image is left behind"
            exit 1
          fi

  # web/: the session API's TypeScript client, Glaze and the app. Format, lint (eslint and
  # stylelint), type-check, the licences and audit of what ships, unit tests with axe, the
  # library and app builds, glave built with the app inside (the `web` feature) and its
  # serving tests, and end-to-end tests in Chromium and WebKit with axe in light and dark,
  # against that real `glave serve --http --web` and its Content Security Policy.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      GLAVE_BIN: ${{ github.workspace }}/target/debug/glave
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
        working-directory: .
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium and WebKit for the end-to-end tests, with what they need
        run: npm run e2e:install -- --with-deps
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run licenses
      - run: npm run audit
      - run: npm test
      - run: npm run build:glaze
      - run: npm run build
      # The glave this builds serves the end-to-end tests too.
      - name: Build glave with the app inside, and test that it serves it
        run: cargo nextest run -p glave --features web --test cli -E 'test(/^serve::/)'
        working-directory: .
      - run: npm run build:showcase
      - run: npm run e2e

  # The release workflow is dist's, with every job's token read-only but the publishing job's
  # (`cargo xtask release-workflow`). dist doesn't check a workflow its config says is edited by
  # hand, so this job does: what the xtask writes from today's config is what's checked in.
  release-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install dist, the version dist-workspace.toml names
        shell: bash
        run: |
          version="$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh
      - run: cargo xtask release-workflow
      - name: release.yml is what the xtask writes
        run: git diff --exit-code

  # Workers on Kubernetes: a kind cluster on the runner, and the Kubernetes backend's tests
  # against it (a stub in glave's place, then the glave this job builds in real workers, over
  # TLS through port-forward and over attach). Everything they make is labelled
  # glave.test=<run id>, and nothing labelled may be left.
  kubernetes:
    runs-on: ubuntu-latest
    env:
      GLAVE_TEST_KUBE: "1"
      GLAVE_TEST_KUBE_RUNTIME_CLASS: glave-test-runc
      GLAVE_TEST_WORKER_GLAVE: ${{ github.workspace }}/target/debug/glave
      GLAVE_TEST_WORKER_IMAGE: buildpack-deps:noble-scm@sha256:4163ac2c58660c533f3cf3d178551287ddd0ac18269ef84f3a382d0698c89254
    steps:
      # Linking every test binary of the workspace fills the runner's disk (ld dies with a bus
      # error), so the toolchains the runner ships and glave never uses go first (about 30 GB).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
          cluster_name: glave
      # A runtime class on kind's own runc, so the real workers run under one (gVisor in kind
      # is a follow-up): the class is set on the Pod and the VM-isolation policy accepts it.
      - name: A runtime class for the real workers
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: glave-test-runc
          handler: runc
          EOF
      - run: cargo build -p glave
      - run: cargo nextest run -p glave-computer --all-features -E 'test(/^worker::kubernetes::/)'
      - name: Disk space after the build
        if: always()
        run: df -h /
      - name: Nothing the Kubernetes tests made is left behind
        if: always()
        run: |
          left="$(kubectl get pods,networkpolicies,secrets -A -l "glave.test=${{ github.run_id }}" -o name)$(kubectl get pods -A -l glave.worker -o name)"
          if [ -n "$left" ]; then
            echo "left behind: $left"
            exit 1
          fi

  # The sandbox on Linux, for real: first Landlock, the fallback, with bubblewrap absent (glave
  # itself is the helper), then bubblewrap and seccomp, with every sandbox test required to
  # run rather than skip.
  sandbox-linux:
    runs-on: ubuntu-latest
    steps:
      # Linking every test binary of the workspace fills the runner's disk (ld dies with a bus
      # error), so the toolchains the runner ships and glave never uses go first (about 30 GB).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo build -p glave
      - name: Landlock, without bubblewrap
        env:
          GLAVE_REQUIRE_LANDLOCK: "1"
          GLAVE_TEST_SANDBOX_HELPER: ${{ github.workspace }}/target/debug/glave
        run: |
          sudo apt-get remove -y bubblewrap >/dev/null 2>&1 || true
          if command -v bwrap; then echo "bubblewrap is still installed"; exit 1; fi
          cargo nextest run -p glave-computer -E 'test(/landlock/)'
      # Ubuntu 23.10 and later let only programs AppArmor allows create user namespaces; this
      # is the profile the person adds too (specs/sandbox.md).
      - name: Install bubblewrap, with an AppArmor profile that lets it make user namespaces
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if [ -d /etc/apparmor.d ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n  include if exists <local/bwrap>\n}\n' | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --version
      - name: bubblewrap and seccomp
        env:
          GLAVE_REQUIRE_SANDBOX: "1"
        run: cargo nextest run -p glave-computer -p glave-harness -p glave -E 'test(/sandbox/)'
      - name: Disk space after the build
        if: always()
        run: df -h /

  # macOS runs once per change, in the merge queue, then on main (and on demand). Pull
  # requests skip it, and a skipped job counts as passing.
  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      GLAVE_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      - run: cargo xtask ci
