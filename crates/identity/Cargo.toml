[package]
name = "glave-identity"
description = "glave's identity: the verified caller, OIDC and local sign-in, and the person an issuer's subject is"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A passkey authenticator in software (`testing`), for the tests of crates that sign in through
# this one.
fake-authenticator = ["dep:aws-lc-rs", "dep:base64"]

[dependencies]
# The fake authenticator's key and signatures, on the crypto rustls already uses.
aws-lc-rs = { workspace = true, optional = true }
# The fake authenticator's buffers, in base64url as WebAuthn's JSON has them.
base64 = { workspace = true, optional = true }
glave-event.workspace = true
# The clock tokens' lifetimes are checked against.
glave-ports.workspace = true
# Random codes and browser sessions.
getrandom.workspace = true
jiff.workspace = true
# Verifying sign-in tokens against the identity provider's keys.
jsonwebtoken.workspace = true
# Fetching an identity provider's discovery document and keys.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Each browser session's id: UUID v7.
uuid.workspace = true
# Passkeys: registering them and signing in with them (WebAuthn's relying party).
webauthn-rs.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
# A real store for the browsers ledger, in memory.
glave-keys.workspace = true
glave-ports = { workspace = true, features = ["conformance"] }
glave-store-sqlite.workspace = true

[lints]
workspace = true
