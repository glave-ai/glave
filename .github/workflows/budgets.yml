name: budgets

# A measurement for #682, reverted before review: the musl build before and after mimalloc,
# and glibc, each built as budgets.yml builds it, then measured side by side on one runner.
on:
  workflow_dispatch:
    inputs:
      arm:
        description: Also build and measure aarch64 musl
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # The commit this branch starts from: the build before the change.
  BASE: d7ac9c76ceda6e6b51aae897c26ada63684125a5
  # Symbols kept, for perf; stripping changes nothing that runs.
  CARGO_PROFILE_BENCH_STRIP: none

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-glave-base, at: base, kind: release, target: x86_64-unknown-linux-musl }
          - { name: x86-glave-head, at: head, kind: release, target: x86_64-unknown-linux-musl }
          - { name: x86-glave-v2, at: head, kind: release, target: x86_64-unknown-linux-musl, features: '"v2"' }
          - { name: x86-glave-nothp, at: head, kind: release, target: x86_64-unknown-linux-musl, features: '"no_thp"' }
          - { name: x86-bench-musl-base, at: base, kind: bench, target: x86_64-unknown-linux-musl }
          - { name: x86-bench-musl-head, at: head, kind: bench, target: x86_64-unknown-linux-musl }
          - { name: x86-bench-musl-v2, at: head, kind: bench, target: x86_64-unknown-linux-musl, features: '"v2"' }
          - { name: x86-bench-musl-nothp, at: head, kind: bench, target: x86_64-unknown-linux-musl, features: '"no_thp"' }
    runs-on: ubuntu-22.04
    steps: &build
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.at == 'base' && env.BASE || github.sha }}
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: musl-gcc
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
      - name: mimalloc's features
        if: matrix.features
        run: sed -i 's/^mimalloc = "0.1.52"$/mimalloc = { version = "0.1.52", features = [${{ matrix.features }}] }/' Cargo.toml && grep -n '^mimalloc' Cargo.toml
      - uses: actions/setup-node@v7
        if: matrix.kind == 'release'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app
        if: matrix.kind == 'release'
        run: npm ci && npm run build
        working-directory: web
      - name: Build glave as the release does
        if: matrix.kind == 'release'
        run: |
          cargo build --locked --profile dist --target "${{ matrix.target }}" -p glave --features web
          mkdir out && cp "target/${{ matrix.target }}/dist/glave" out/glave
        env:
          RUSTFLAGS: -Ctarget-feature=+crt-static -Clink-self-contained=yes
      - name: Build the benchmark as budgets.yml does
        if: matrix.kind == 'bench'
        run: |
          cargo xtask bench --bench budgets --target "${{ matrix.target }}" --no-run \
            --message-format=json-render-diagnostics > built.json
          mkdir out
          cp "$(jq -r 'select(.target.name == "budgets" and .executable) | .executable' built.json)" out/budgets
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out
          if-no-files-found: error
          retention-days: 3

  build-arm:
    if: inputs.arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm-glave-base, at: base, kind: release, target: aarch64-unknown-linux-musl }
          - { name: arm-glave-head, at: head, kind: release, target: aarch64-unknown-linux-musl }
          - { name: arm-bench-musl-base, at: base, kind: bench, target: aarch64-unknown-linux-musl }
          - { name: arm-bench-musl-head, at: head, kind: bench, target: aarch64-unknown-linux-musl }
    runs-on: ubuntu-22.04-arm
    steps: *build

  measure:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: x86-*
      - name: Machine
        run: |
          chmod +x x86-*/*
          echo "measured on $(nproc) cores of $(lscpu | sed -n 's/^Model name: *//p')"
          echo "THP enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          echo "THP defrag: $(cat /sys/kernel/mm/transparent_hugepage/defrag)"
          echo "overcommit: $(cat /proc/sys/vm/overcommit_memory)"
          uname -r
      - name: Size
        run: |
          for v in base head v2 nothp; do echo "glave $v: $(stat -c %s x86-glave-$v/glave) bytes"; done
      - name: Startup, glave --version, 300 times each, interleaved
        run: |
          launch() {
            start=$(date +%s%N)
            for i in $(seq 300); do env $2 x86-glave-$1/glave --version >/dev/null; done
            end=$(date +%s%N)
            echo "round $round glave $1 ${2:-}: $(( (end - start) / 300000 )) us per launch"
          }
          for round in 1 2 3; do
            launch base
            launch head
            launch v2
            launch nothp
            launch head MIMALLOC_ALLOW_THP=0
            launch head MIMALLOC_ARENA_EAGER_COMMIT=0
            launch head MIMALLOC_ARENA_RESERVE=64MiB
            launch base MIMALLOC_ALLOW_THP=0
          done
      - name: Startup, counted (perf stat, strace)
        continue-on-error: true
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1
          for v in base head v2 nothp; do
            echo "== perf stat $v"
            perf stat -r 200 -e task-clock,page-faults,context-switches x86-glave-$v/glave --version 2>&1 >/dev/null | grep -E 'task-clock|page-faults|context|elapsed'
          done
          sudo apt-get install -y -q strace >/dev/null 2>&1 || true
          for v in base head v2; do
            echo "== strace -c $v"
            strace -c -f x86-glave-$v/glave --version 2>&1 >/dev/null | head -30
          done
          echo "== strace head, memory and files"
          strace -T -e trace=memory,prctl,openat,read,sysinfo,exit_group x86-glave-head/glave --version 2>&1 >/dev/null | head -60
          echo "== strace base, memory and files"
          strace -T -e trace=memory,prctl,openat,read,sysinfo,exit_group x86-glave-base/glave --version 2>&1 >/dev/null | head -60
      - name: The budgets benchmark, interleaved
        run: |
          for round in 1 2 3; do
            for v in base head v2 nothp; do
              echo "== round $round $v"
              GLAVE_BUDGETS_BINARY=x86-glave-$v/glave x86-bench-musl-$v/budgets | grep -E 'release binary|answered|resume|record' || true
            done
          done

  measure-arm:
    if: inputs.arm
    needs: build-arm
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: arm-*
      - name: Machine
        run: |
          chmod +x arm-*/*
          echo "measured on $(nproc) cores of $(lscpu | sed -n 's/^Model name: *//p')"
      - name: Size and linking
        run: |
          for v in base head; do
            echo "glave $v: $(stat -c %s arm-glave-$v/glave) bytes"
            file arm-glave-$v/glave
            arm-glave-$v/glave --version
          done
      - name: Startup, glave --version, 300 times each, interleaved
        run: |
          for round in 1 2 3; do
            for v in base head; do
              start=$(date +%s%N)
              for i in $(seq 300); do arm-glave-$v/glave --version >/dev/null; done
              end=$(date +%s%N)
              echo "round $round glave $v: $(( (end - start) / 300000 )) us per launch"
            done
          done
      - name: The budgets benchmark, interleaved
        run: |
          for round in 1 2 3 4 5; do
            for v in base head; do
              echo "== round $round musl-$v"
              GLAVE_BUDGETS_BINARY=arm-glave-$v/glave arm-bench-musl-$v/budgets | grep -E 'release binary|answered|resume|record' || true
            done
          done
