@for (toast of shown(); track toast.id) {
  <div [attr.data-testid]="ids().item" [class]="toast.toneClass">
    <span class="message">{{ toast.message }}</span>
    @if (toast.action; as action) {
      <button
        type="button"
        class="action"
        [attr.data-testid]="ids().action"
        (click)="act(toast.id)"
      >
        {{ action.label }}
      </button>
    }
    <button
      glzIconButton
      size="sm"
      [attr.data-testid]="ids().dismiss"
      [label]="dismissLabel()"
      (click)="dismiss(toast.id)"
    >
      <glz-icon [icon]="closeIcon" />
    </button>
  </div>
}
