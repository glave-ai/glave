<a
  glzNavItem
  data-testid="nav-thread"
  [routerLink]="thread().link"
  [current]="thread().current"
  (click)="followed()"
>
  <span class="lines">
    <!-- The title in its own direction; the space after it keeps it apart from what follows. -->
    <span class="title" dir="auto" data-testid="nav-thread-title">{{ thread().title }} </span>
    @if (thread().line; as line) {
      <span class="line" dir="auto" data-testid="nav-thread-line" [class.needs-you]="line.needsYou"
        >{{ line.text }}
      </span>
    }
  </span>
  @if (thread().running) {
    <glz-icon
      glzNavItemEnd
      class="status glz-spin"
      data-testid="nav-thread-running"
      [icon]="running.icon"
      [label]="running.label"
    />
  } @else {
    <time
      glzNavItemEnd
      class="since"
      data-testid="nav-thread-since"
      [attr.datetime]="thread().since.at"
    >
      <span aria-hidden="true">{{ thread().since.short }}</span>
      <span class="glz-visually-hidden">{{ thread().since.long }}</span>
    </time>
  }
</a>
@if (thread().hasChildren) {
  <div class="children" data-testid="nav-children">
    @for (child of thread().children; track child.id) {
      <app-nav-thread [thread]="child" (navigated)="followed()" />
    }
  </div>
}
