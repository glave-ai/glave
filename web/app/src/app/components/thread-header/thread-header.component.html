<header class="bar" [class.phone]="phone()">
  @if (phone()) {
    <button
      glzIconButton
      class="touch"
      data-testid="page-menu"
      [label]="copy.menu"
      [attr.aria-expanded]="navOpen()"
      [attr.aria-keyshortcuts]="navShortcut"
      (click)="toggleNav()"
    >
      <glz-icon [icon]="icons.menu" />
    </button>
  }
  <div class="heading">
    <h1 class="title" data-testid="thread-title">
      <button
        type="button"
        class="rename"
        data-testid="thread-rename"
        [glzTooltip]="copy.rename"
        (click)="startRename()"
      >
        <span dir="auto">{{ title() }}</span>
      </button>
    </h1>
    @if (meta()) {
      <p class="meta" data-testid="thread-meta">
        @if (project()) {
          <glz-icon class="folder" [icon]="icons.folder" />
        }
        <span class="where">{{ meta() }}</span>
      </p>
    }
  </div>
  @if (phone()) {
    <button
      glzIconButton
      class="touch"
      data-testid="thread-tools"
      [label]="phoneButton().label"
      [attr.aria-pressed]="panelOpen()"
      [attr.aria-keyshortcuts]="panelShortcut"
      (click)="phoneTools()"
    >
      <glz-icon [class.glz-mirrored]="phoneButton().mirrored" [icon]="phoneButton().icon" />
    </button>
  } @else if (changed()) {
    <button
      glzButton
      size="sm"
      pill
      class="changes"
      data-testid="thread-changes"
      [attr.aria-pressed]="changesShown()"
      (click)="toggleChanges()"
    >
      {{ copy.changes }}
      <span class="count">{{ count() }}</span>
    </button>
  } @else if (toolsButton()) {
    <button
      glzIconButton
      data-testid="thread-tools"
      [label]="copy.tools"
      [attr.aria-pressed]="panelOpen()"
      [attr.aria-keyshortcuts]="panelShortcut"
      (click)="togglePanel()"
    >
      <glz-icon class="glz-mirrored" [icon]="icons.tools" />
    </button>
  }
</header>
