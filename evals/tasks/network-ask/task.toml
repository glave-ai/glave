[task]
name = "glave/network-ask"
description = "With the network off, as an organization has it, an install that needs the internet asks to run with the network, in the sandbox otherwise."

[agent]
timeout_sec = 600

[glave]
permissions = "auto"
sandboxed = true
network = false
# Asking for the network is recorded in `approval.requested`. The judge may let it run with no one
# there when the person asked for that very command (#1399), so whether the report is written
# proves nothing either way.
checks = [{ sent = "\"lifted\":\"network\"" }]
