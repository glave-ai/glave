[task]
name = "glave/goal-check"
description = "A goal whose objective names its check in words: five stubbed functions, too many for one short turn; the goal continues until the model has run cargo test and says the goal is met, and hidden tests grade it."

[agent]
timeout_sec = 900

[glave]
tier = "hard"
# Real work runs commands: nothing asks but secrets.
permissions = "auto"
# Three tool steps a turn, so the work takes several turns and the goal must continue.
max_steps = 4
goal = { budget = 600000 }
checks = [{ goal_ended = ["met"] }]
