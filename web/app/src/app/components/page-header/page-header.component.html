<glz-page-header testId="page" [backLabel]="backLabel()" (back)="goBack()">
  @if (narrow()) {
    <button
      glzPageHeaderStart
      glzIconButton
      data-testid="page-menu"
      [label]="copy.menu"
      [attr.aria-expanded]="open()"
      [attr.aria-keyshortcuts]="shortcut"
      (click)="toggle()"
    >
      <glz-icon [icon]="icon" />
    </button>
  }
</glz-page-header>
