@if (choosable()) {
  <glz-menu-select
    testId="permissions"
    quiet
    align="start"
    [label]="copy.label"
    [options]="options()"
    [value]="shown()"
    (valueChange)="pick($event)"
  />
}
@if (fixed(); as mode) {
  <span class="mode" data-testid="permissions" [attr.title]="mode.title">
    <glz-icon [icon]="mode.icon" />
    <span class="glz-visually-hidden">{{ copy.prefix }}</span>
    <span>{{ mode.text }}</span>
    <span class="glz-visually-hidden">{{ mode.title }}</span>
  </span>
}
