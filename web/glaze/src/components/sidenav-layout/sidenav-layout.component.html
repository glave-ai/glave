@if (modal()) {
  <div class="scrim" data-testid="sidenav-scrim" aria-hidden="true" (click)="close()"></div>
}
<aside
  class="sidenav"
  data-testid="sidenav"
  [attr.aria-label]="label()"
  [attr.aria-modal]="ariaModal()"
  [attr.role]="role()"
  [inert]="closed()"
>
  <ng-content select="[glzSidenav]" />
</aside>
<div class="content" [inert]="modal()"><ng-content /></div>
